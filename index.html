<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Lei Compass: a research-based money app for students, with an AI coach.">
<meta name="theme-color" content="#0b7a5e">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<script>window.LEI_CONFIG = {aiEndpoint: "/api/ai"};</script>
<title>Lei Compass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..700&display=swap">
<style>
/* Layout: phone app shell (top bar, one column, bottom tabs). From 960px a left rail; from 1280px the AI coach docks as a right column.
   Identity: polymer-banknote paper, jade money ink, plum for anything the AI writes, ochre for "time to decide". */
:root{
  --paper:#eef3f0; --card:#fbfcfb; --raised:#ffffff; --sunken:#e4ebe7;
  --ink:#0f1d18; --ink-2:#43534d; --ink-3:#6b7b74;
  --line:#d5dfd9; --line-2:#bccac3;
  --jade:#0b7a5e; --jade-strong:#075c47; --on-jade:#ffffff; --jade-soft:#d3eae1; --jade-wash:#e6f2ed;
  --plum:#5a44c7; --plum-soft:#e8e4fb;
  --ochre:#875800; --ochre-fill:#e0a019; --ochre-soft:#f6e9cb;
  --good:#11743a; --bad:#b3352e; --bad-soft:#f8e0dd;
  --s1:#0f8a6a; --s2:#2a78d6; --s3:#eb6834;
  --chart-muted:#b6c4bd; --grid:#dfe7e2;
  --shadow-1:0 1px 1px rgba(15,29,24,.04),0 2px 8px rgba(15,29,24,.06);
  --shadow-2:0 18px 50px rgba(15,29,24,.22);
  --scrim:rgba(9,18,14,.45);
  --font-display:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-ui:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --rail-w:236px; --coach-w:392px; --tabbar-h:66px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0a100d; --card:#111915; --raised:#16201b; --sunken:#1b2621;
    --ink:#e4ede8; --ink-2:#a8b7b0; --ink-3:#7d8c85;
    --line:#22302a; --line-2:#30413a;
    --jade:#3dbb93; --jade-strong:#66d3ae; --on-jade:#03140e; --jade-soft:#143529; --jade-wash:#0f241c;
    --plum:#ad9fff; --plum-soft:#231e44;
    --ochre:#e8b04a; --ochre-fill:#d99a1c; --ochre-soft:#32270f;
    --good:#4cc274; --bad:#f2786e; --bad-soft:#3a1c19;
    --s1:#27a07b; --s2:#3987e5; --s3:#d95926;
    --chart-muted:#3a4a43; --grid:#1f2b26;
    --shadow-1:0 1px 0 rgba(0,0,0,.35); --shadow-2:0 20px 56px rgba(0,0,0,.6); --scrim:rgba(0,0,0,.62);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0a100d; --card:#111915; --raised:#16201b; --sunken:#1b2621;
  --ink:#e4ede8; --ink-2:#a8b7b0; --ink-3:#7d8c85;
  --line:#22302a; --line-2:#30413a;
  --jade:#3dbb93; --jade-strong:#66d3ae; --on-jade:#03140e; --jade-soft:#143529; --jade-wash:#0f241c;
  --plum:#ad9fff; --plum-soft:#231e44;
  --ochre:#e8b04a; --ochre-fill:#d99a1c; --ochre-soft:#32270f;
  --good:#4cc274; --bad:#f2786e; --bad-soft:#3a1c19;
  --s1:#27a07b; --s2:#3987e5; --s3:#d95926;
  --chart-muted:#3a4a43; --grid:#1f2b26;
  --shadow-1:0 1px 0 rgba(0,0,0,.35); --shadow-2:0 20px 56px rgba(0,0,0,.6); --scrim:rgba(0,0,0,.62);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--jade)}
p{margin:0}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;padding:0;margin:-1px}
.ico{width:20px;height:20px;flex:none}

/* ---------- shell ---------- */
.layout{min-height:100vh;min-height:100dvh}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 12px 8px 16px;background:color-mix(in srgb,var(--paper) 88%,transparent);-webkit-backdrop-filter:saturate(1.3) blur(14px);backdrop-filter:saturate(1.3) blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--font-display);font-weight:760;font-size:19px;letter-spacing:-.025em;color:var(--ink);border:0;background:none;padding:0;cursor:pointer}
.brand svg{width:28px;height:28px;flex:none}
.bm-disc{fill:var(--jade)} .bm-n{fill:var(--on-jade)} .bm-s{fill:var(--on-jade);opacity:.42} .bm-c{fill:var(--jade)}
.top-actions{display:flex;align-items:center;gap:4px}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink-3);padding:4px 8px;border-radius:999px;background:var(--sunken);white-space:nowrap;border:0;cursor:pointer}
.status .ico{width:15px;height:15px}
.status.cloud{color:var(--jade-strong);background:var(--jade-soft)}
.status.demo{color:var(--ochre);background:var(--ochre-soft)}
main#main{display:block;padding:14px 16px calc(var(--tabbar-h) + 28px + env(safe-area-inset-bottom,0px));max-width:800px;margin:0 auto;min-width:0;width:100%}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(5,1fr);padding:5px 6px calc(5px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 2px;border:0;background:none;border-radius:12px;color:var(--ink-3);font-size:11.5px;font-weight:650;cursor:pointer;min-width:0}
.tab-ico{display:grid;place-items:center;width:46px;height:28px;border-radius:999px;transition:background .15s}
.tab .ico{width:21px;height:21px}
.tab[aria-current="page"]{color:var(--jade-strong)}
.tab[aria-current="page"] .tab-ico{background:var(--jade-soft)}
.rail{display:none}
#coach-dock{display:none}
#coach-park{display:none}
body.is-onboarding .tabbar,body.is-onboarding .rail,body.is-onboarding #coach-dock,body.is-onboarding .topbar{display:none!important}
body.is-onboarding main#main{padding-bottom:40px}

@media (min-width:960px){
  .topbar,.tabbar{display:none}
  .layout{display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr)}
  body.is-onboarding .layout{grid-template-columns:minmax(0,1fr)}
  .rail{display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh;height:100dvh;overflow:auto;padding:20px 12px 14px;border-right:1px solid var(--line);background:var(--card)}
  main#main{padding:26px 32px 56px}
}
@media (min-width:1280px){
  .layout{grid-template-columns:var(--rail-w) minmax(0,1fr) var(--coach-w)}
  #coach-dock{display:flex;flex-direction:column;position:sticky;top:0;height:100vh;height:100dvh;border-left:1px solid var(--line);background:var(--card);min-width:0}
}
.rail .brand{padding:2px 10px 8px}
.rail-nav{display:flex;flex-direction:column;gap:1px}
.rail-label{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);padding:12px 10px 4px}
.rail-link{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border:0;background:none;border-radius:9px;color:var(--ink-2);font-weight:600;font-size:14px;cursor:pointer;text-align:left}
.rail-link .ico{width:18px;height:18px}
.rail-link:hover{background:var(--sunken);color:var(--ink)}
.rail-link[aria-current="page"]{background:var(--jade-soft);color:var(--jade-strong)}
.rail-link.sub{padding-left:38px;font-weight:550}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:8px 4px 0;border-top:1px solid var(--line)}

/* ---------- page furniture ---------- */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:2px 0 14px}
.page-title{font-size:27px;font-weight:760;letter-spacing:-.025em;line-height:1.1}
.page-kicker{color:var(--ink-3);font-size:13px;font-weight:600;margin-bottom:3px}
.subtabs{display:flex;gap:3px;padding:3px;background:var(--sunken);border-radius:12px;margin:0 0 16px;overflow-x:auto;scrollbar-width:none}
.subtab{flex:1 0 auto;border:0;background:none;padding:8px 12px;border-radius:9px;font-weight:650;font-size:13.5px;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.subtab[aria-selected="true"]{background:var(--raised);color:var(--ink);box-shadow:var(--shadow-1)}
.stack{display:flex;flex-direction:column;gap:18px;min-width:0}
.section{display:flex;flex-direction:column;gap:10px;min-width:0}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.h2{font-family:var(--font-display);font-size:18px;font-weight:720;letter-spacing:-.015em}
.h3{font-family:var(--font-ui);font-size:14.5px;font-weight:700;letter-spacing:0}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
.muted{color:var(--ink-3)}
.hint{font-size:12.5px;color:var(--ink-3);line-height:1.45}
.small{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.card.flat{background:transparent}
.row-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spacer{flex:1}
.num{font-variant-numeric:tabular-nums}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px;padding:8px 14px;border-radius:10px;border:1px solid var(--line-2);background:var(--raised);color:var(--ink);font-weight:650;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .15s,border-color .15s,color .15s}
.btn:hover{background:var(--sunken)}
.btn:active{transform:translateY(1px)}
.btn .ico{width:17px;height:17px}
.btn.primary{background:var(--jade);border-color:var(--jade);color:var(--on-jade)}
.btn.primary:hover{background:var(--jade-strong);border-color:var(--jade-strong)}
.btn.ai{background:var(--plum-soft);border-color:transparent;color:var(--plum)}
.btn.ai:hover{border-color:var(--plum)}
.btn.quiet{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.quiet:hover{background:var(--sunken);color:var(--ink)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent);background:transparent}
.btn.danger:hover{background:var(--bad-soft)}
.btn.sm{min-height:32px;padding:5px 10px;font-size:13px;border-radius:8px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.icon-btn{width:40px;height:40px;display:inline-grid;place-items:center;border-radius:10px;border:0;background:none;color:var(--ink-2);cursor:pointer;flex:none}
.icon-btn:hover{background:var(--sunken);color:var(--ink)}
.icon-btn[disabled]{opacity:.4;cursor:not-allowed}
.link-btn{border:0;background:none;padding:2px 0;color:var(--jade);font-weight:650;cursor:pointer;font-size:13px;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.link-btn:hover{color:var(--jade-strong)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.label{font-size:13px;font-weight:650;color:var(--ink-2)}
.input{width:100%;min-height:42px;padding:9px 12px;border-radius:10px;border:1px solid var(--line-2);background:var(--raised);color:var(--ink);outline:none;transition:border-color .15s,box-shadow .15s}
.input::placeholder{color:var(--ink-3)}
.input:focus{border-color:var(--jade);box-shadow:0 0 0 3px color-mix(in srgb,var(--jade) 22%,transparent)}
select.input{appearance:none;-webkit-appearance:none;padding-right:34px;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 17px) 52%,calc(100% - 12px) 52%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
textarea.input{min-height:84px;resize:vertical;line-height:1.45}
.input.big{font-size:30px;font-weight:650;min-height:58px;letter-spacing:-.02em}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:5px 12px;border-radius:999px;border:1px solid var(--line-2);background:var(--raised);color:var(--ink-2);font-size:13px;font-weight:650;cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--ink-3);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chip .ico{width:15px;height:15px}
.seg{display:inline-flex;flex-wrap:wrap;padding:3px;background:var(--sunken);border-radius:11px;gap:2px;max-width:100%}
.seg button{border:0;background:none;padding:7px 12px;border-radius:8px;font-weight:650;font-size:13px;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--ink);box-shadow:var(--shadow-1)}
.switch{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:14px;font-weight:600;color:var(--ink-2)}
.switch input{appearance:none;-webkit-appearance:none;width:38px;height:22px;border-radius:999px;background:var(--line-2);position:relative;cursor:pointer;flex:none;transition:background .15s;margin:0}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--raised);transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch input:checked{background:var(--jade)}
.switch input:checked::after{transform:translateX(16px)}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 2px;cursor:pointer;font-size:14px}
.check input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--jade);flex:none}
.check.done span{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--line-2)}

/* ---------- pills ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:650;background:var(--sunken);color:var(--ink-2);white-space:nowrap;line-height:1.5}
.pill .ico{width:13px;height:13px}
.pill.tag::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.pill.tag.need::before{background:var(--s1)} .pill.tag.value::before{background:var(--s2)} .pill.tag.want::before{background:var(--s3)}
.pill.ai{background:var(--plum-soft);color:var(--plum)}
.pill.ready{background:var(--ochre-soft);color:var(--ochre)}
.pill.good{background:var(--jade-soft);color:var(--jade-strong)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.bill{background:transparent;border:1px solid var(--line-2);color:var(--ink-3);padding:1px 7px}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;border-radius:20px;padding:18px 18px 16px;background:var(--jade-wash);border:1px solid var(--jade-soft);isolation:isolate}
.hero::after{content:"";position:absolute;top:-55%;right:-30%;width:95%;aspect-ratio:1;max-width:none;background-image:var(--guilloche,none);background-size:contain;background-repeat:no-repeat;z-index:-1;pointer-events:none}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hero-num{font-family:var(--font-ui);font-size:clamp(46px,13vw,64px);font-weight:650;letter-spacing:-.035em;line-height:1;margin:12px 0 8px;color:var(--ink)}
.hero-num small{font-size:.38em;font-weight:650;letter-spacing:0;margin-left:8px;color:var(--ink-2)}
.hero-sub{color:var(--ink-2);font-size:14px;max-width:46ch;margin-bottom:14px}
.meter{height:8px;border-radius:999px;background:var(--jade-soft);overflow:hidden}
.meter>span{display:block;height:100%;border-radius:999px;background:var(--jade);min-width:2px}
.meter.warn{background:var(--ochre-soft)} .meter.warn>span{background:var(--ochre-fill)}
.meter.over{background:var(--bad-soft)} .meter.over>span{background:var(--bad)}
.meter-row{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--ink-2);margin-top:7px;flex-wrap:wrap}

/* ---------- quick add ---------- */
.qa-form{display:flex;gap:8px;margin-top:10px}
.qa-form .input{flex:1;min-width:0;font-size:16px}
.qa-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap}
.qa-preview{display:flex;flex-direction:column;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.qa-item{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--raised)}
.qa-sum{display:flex;align-items:center;gap:12px;min-width:0}
.qa-fields{display:flex;flex-direction:column;gap:10px;padding:6px 0 2px;border-top:1px solid var(--line);margin-top:4px}
.qa-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}

/* ---------- lists ---------- */
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:10px 6px;border-bottom:1px solid var(--line);min-width:0;color:var(--ink)}
.row:last-child{border-bottom:0}
button.row{width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer;font:inherit}
button.row:hover{background:var(--sunken)}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row-title{font-weight:650;overflow-wrap:anywhere;line-height:1.35}
.row-sub{font-size:12.5px;color:var(--ink-3);display:flex;gap:4px 8px;flex-wrap:wrap;align-items:center}
.amt{font-variant-numeric:tabular-nums;font-weight:650;white-space:nowrap;text-align:right}
.amt.in{color:var(--good)}
.amt.save{color:var(--jade-strong)}
.cat-ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--sunken);color:var(--ink-2);flex:none}
.cat-ico .ico{width:19px;height:19px}
.cat-ico.in{background:var(--jade-soft);color:var(--jade-strong)}
.cat-ico.save{background:var(--jade-soft);color:var(--jade-strong)}
.day{display:flex;flex-direction:column}
.day-head{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;padding:12px 6px 4px;border-bottom:1px solid var(--line)}
.nudge{display:flex;flex-direction:column;gap:8px;padding:12px 2px;border-bottom:1px solid var(--line)}
.nudge:last-child{border-bottom:0}
.nudge-top{display:flex;gap:10px;align-items:flex-start}
.nudge-text{flex:1;min-width:0;font-size:14px}
.nudge-text strong{font-weight:700}
.rate{display:flex;flex-wrap:wrap;gap:6px}
.plan-line{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--sunken);font-size:14px}
.plan-line .ico{color:var(--jade);margin-top:1px}

/* ---------- KPI + charts ---------- */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:11px 12px;min-width:0}
.kpi-label{font-size:12.5px;color:var(--ink-3);font-weight:650}
.kpi-val{font-size:21px;font-weight:650;letter-spacing:-.02em;margin-top:2px;overflow-wrap:anywhere}
.kpi-note{font-size:12px;color:var(--ink-3)}
.chart-card{display:flex;flex-direction:column;gap:12px}
.chart-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.chart-head .h3{margin-bottom:2px}
.bars{display:flex;flex-direction:column;gap:4px}
.bar-row{display:grid;grid-template-columns:minmax(84px,34%) minmax(0,1fr);align-items:center;gap:10px;min-height:30px;border-radius:7px;padding:2px 6px;outline-offset:0}
.bar-row:hover,.bar-row:focus-visible{background:var(--sunken)}
.bar-label{font-size:13px;color:var(--ink-2);overflow-wrap:anywhere;line-height:1.3}
.bar-track{display:flex;align-items:center;gap:8px;min-width:0}
.bar{height:12px;background:var(--s1);border-radius:0 4px 4px 0;min-width:3px;flex:none}
.bar-val{font-size:12.5px;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:650}
.bar-val span{color:var(--ink-3);font-weight:550}
.stackbar{display:flex;gap:2px;height:14px;border-radius:0 4px 4px 0;overflow:hidden}
.stackbar>span{height:100%;min-width:3px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--ink-2)}
.legend>span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;flex:none}
.legend b{color:var(--ink);font-weight:650}
.cols{position:relative;padding:0 0 24px 44px}
.cols-plot{position:relative;height:var(--h,150px);display:flex;align-items:flex-end;border-bottom:1px solid var(--line-2)}
.cols-grid{position:absolute;left:-44px;right:0;border-top:1px solid var(--grid);pointer-events:none}
.cols-grid span{position:absolute;left:0;top:-8px;width:38px;text-align:right;font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.col{position:relative;flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-width:0;border-radius:6px}
.col:hover,.col:focus-visible{background:color-mix(in srgb,var(--sunken) 70%,transparent)}
.col-bar{width:min(24px,62%);background:var(--chart-muted);border-radius:4px 4px 0 0;min-height:2px}
.col.emph .col-bar,.col.fill .col-bar{background:var(--s1)}
.col-x{position:absolute;top:calc(100% + 5px);font-size:11px;color:var(--ink-3);white-space:nowrap}
.col.emph .col-x{color:var(--ink);font-weight:650}
.col-ref{position:absolute;left:0;right:0;border-top:2px solid var(--ink-2);pointer-events:none;z-index:1}
.legend i.ref{height:2px;width:16px;border-radius:0;background:var(--ink-2)}
.dots{display:flex;flex-direction:column;gap:2px}
.dot-row{display:grid;grid-template-columns:minmax(84px,34%) minmax(0,1fr) 92px;align-items:center;gap:10px;min-height:30px;border-radius:7px;padding:2px 6px}
.dot-row:hover,.dot-row:focus-visible{background:var(--sunken)}
.dot-track{position:relative;height:20px;margin:0 7px}
.dot-track::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:1px solid var(--grid)}
.dot-track b{position:absolute;top:calc(50% - 4px);width:1px;height:8px;background:var(--line-2)}
.dot-track i{position:absolute;top:50%;width:13px;height:13px;border-radius:50%;background:var(--s1);box-shadow:0 0 0 2px var(--card);transform:translate(-50%,-50%)}
.dot-val{font-size:12.5px;color:var(--ink-2);text-align:right;font-variant-numeric:tabular-nums}
.dot-val b{color:var(--ink);font-weight:650}
.dot-axis{display:grid;grid-template-columns:minmax(84px,34%) minmax(0,1fr) 92px;gap:10px;padding:0 6px;font-size:11px;color:var(--ink-3)}
.dot-axis>span:nth-child(2){display:flex;justify-content:space-between;margin:0 -4px}
.table-wrap{overflow-x:auto}
table.data{width:100%;border-collapse:collapse;font-size:13px}
table.data th,table.data td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.data th{font-size:12px;color:var(--ink-3);font-weight:650}
table.data .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.finding{display:flex;gap:10px;align-items:flex-start;padding:11px 2px;border-bottom:1px solid var(--line);font-size:14px}
.finding:last-child{border-bottom:0}
.finding .ico{color:var(--jade);margin-top:2px;width:18px;height:18px}
.finding-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.tip{position:fixed;z-index:120;pointer-events:none;background:var(--ink);color:var(--paper);padding:7px 10px;border-radius:9px;font-size:12.5px;line-height:1.35;box-shadow:var(--shadow-2);max-width:250px;opacity:0;transition:opacity .1s;left:0;top:0}
.tip.show{opacity:1}
.tip b{display:block;font-size:14px;font-weight:700}

/* ---------- goals / wait list ---------- */
.goal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.goal{display:flex;flex-direction:column;gap:10px}
.goal-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.goal-name{font-family:var(--font-display);font-size:17px;font-weight:720;letter-spacing:-.01em;overflow-wrap:anywhere}
.goal-why{font-size:13px;color:var(--ink-2);font-style:italic;overflow-wrap:anywhere}
.goal-bar{height:10px;border-radius:999px;background:var(--jade-soft);overflow:hidden}
.goal-bar>span{display:block;height:100%;background:var(--jade);border-radius:999px;min-width:3px}
.goal-nums{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--ink-2);flex-wrap:wrap}
.goal-nums b{color:var(--ink);font-weight:700}
.mini-goals{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.wish{display:flex;flex-direction:column;gap:10px}
.wish.ready{border-color:color-mix(in srgb,var(--ochre-fill) 55%,var(--line))}
.wish-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.wish-name{font-weight:700;font-size:15.5px;overflow-wrap:anywhere}
.wish-price{font-weight:700;font-size:17px;white-space:nowrap;letter-spacing:-.01em}
.wish-facts{display:flex;flex-wrap:wrap;gap:6px}
.timer{height:6px;border-radius:999px;background:var(--sunken);overflow:hidden}
.timer>span{display:block;height:100%;background:var(--ochre-fill);border-radius:999px}
.stat-line{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:13.5px;color:var(--ink-2)}
.stat-line b{color:var(--ink);font-weight:700}
.empty{border:1px dashed var(--line-2);border-radius:14px;padding:18px;color:var(--ink-2);display:flex;flex-direction:column;gap:10px;align-items:flex-start;font-size:14px}
.empty .h3{color:var(--ink)}

/* ---------- plan ---------- */
.money-rows{display:flex;flex-direction:column;gap:8px}
.money-row{display:grid;grid-template-columns:minmax(0,1fr) 118px 40px;gap:8px;align-items:center}
.auto-line{display:flex;justify-content:space-between;gap:8px;padding:9px 12px;border-radius:10px;background:var(--sunken);font-size:13.5px;color:var(--ink-2)}
.calc{display:flex;flex-direction:column;gap:12px}
.calc-big{font-size:38px;font-weight:650;letter-spacing:-.03em;line-height:1}
.calc-big small{font-size:.42em;color:var(--ink-2);margin-left:6px;letter-spacing:0}
.formula{font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.sticky-save{position:sticky;bottom:calc(var(--tabbar-h) + 10px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;justify-content:flex-end;gap:8px;align-items:center;padding:10px 12px;border-radius:14px;background:color-mix(in srgb,var(--card) 92%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);box-shadow:var(--shadow-1)}
@media (min-width:960px){.sticky-save{bottom:14px}}

/* ---------- AI output ---------- */
.ai-box{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:14px;background:var(--plum-soft);color:var(--ink)}
.ai-box .ai-label{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--plum)}
.ai-box .ai-label .ico{width:15px;height:15px}
.ai-box .ai-label .btn,.ai-box .ai-label .icon-btn{text-transform:none;letter-spacing:0;color:var(--ink-2)}
.ai-box .ai-label .icon-btn{width:32px;height:32px}
.md{font-size:14.5px;line-height:1.55;overflow-wrap:anywhere}
.md p{margin:0 0 8px}.md p:last-child{margin-bottom:0}
.md ul,.md ol{margin:4px 0 8px;padding-left:20px}
.md li{margin:2px 0}
.md h4{font-family:var(--font-ui);font-size:14.5px;font-weight:700;margin:8px 0 4px}
.thinking{display:inline-flex;align-items:center;gap:8px;color:var(--plum);font-weight:600;font-size:14px}
.thinking i{width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 1s infinite ease-in-out}
.thinking i:nth-child(2){animation-delay:.15s}.thinking i:nth-child(3){animation-delay:.3s}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
.err{color:var(--bad);font-size:13.5px}

/* ---------- coach ---------- */
.coach{display:flex;flex-direction:column;min-height:0;height:100%;background:var(--card)}
.coach-head{display:flex;align-items:center;gap:10px;padding:14px 14px 12px 16px;border-bottom:1px solid var(--line)}
.coach-avatar{width:34px;height:34px;border-radius:11px;background:var(--plum-soft);color:var(--plum);display:grid;place-items:center;flex:none}
.coach-title{font-family:var(--font-display);font-weight:720;font-size:16.5px;line-height:1.1}
.coach-sub{font-size:12px;color:var(--ink-3)}
.coach-msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px;min-height:0;overscroll-behavior:contain}
.msg{max-width:90%;padding:10px 13px;border-radius:15px;font-size:14.5px;line-height:1.5;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--jade);color:var(--on-jade);border-bottom-right-radius:5px;white-space:pre-wrap}
.msg.bot{align-self:flex-start;background:var(--sunken);border-bottom-left-radius:5px}
.msg.err{background:var(--bad-soft);color:var(--ink)}
.coach-empty{display:flex;flex-direction:column;gap:12px;margin:auto 0}
.coach-empty p{font-size:14px;color:var(--ink-2)}
.coach-input{border-top:1px solid var(--line);padding:10px 12px 6px;display:flex;gap:8px;align-items:flex-end}
.coach-input textarea{flex:1;min-height:44px;max-height:150px;resize:none;font-size:15px}
.coach-note{font-size:11.5px;color:var(--ink-3);padding:0 14px 10px}
.coach-off{margin:auto 0;display:flex;flex-direction:column;gap:10px;font-size:14px;color:var(--ink-2)}
.coach-slot{display:flex;flex-direction:column;height:calc(100dvh - 210px - env(safe-area-inset-bottom,0px) - env(safe-area-inset-top,0px));min-height:430px;border:1px solid var(--line);border-radius:16px;overflow:hidden}

/* ---------- learn ---------- */
.learn-list{display:flex;flex-direction:column;gap:8px}
.learn-card{border:1px solid var(--line);border-radius:14px;background:var(--card)}
.learn-card>summary{list-style:none;cursor:pointer;padding:13px 14px;display:flex;gap:10px;align-items:flex-start;justify-content:space-between;border-radius:14px}
.learn-card>summary::-webkit-details-marker{display:none}
.learn-card>summary:hover{background:var(--sunken)}
.learn-card[open]>summary{border-bottom-left-radius:0;border-bottom-right-radius:0}
.lc-title{display:flex;flex-direction:column;gap:1px;min-width:0}
.lc-title strong{font-size:15px;font-weight:700;overflow-wrap:anywhere}
.lc-title span{font-size:12px;color:var(--ink-3);font-weight:600}
.learn-body{padding:2px 14px 14px;display:flex;flex-direction:column;gap:10px;font-size:14px;color:var(--ink-2)}
.learn-body .label{display:block;margin-bottom:2px;color:var(--ink);font-size:12.5px}
.learn-body p{max-width:68ch}
.lc-src{font-size:12.5px;color:var(--ink-3)}
.lc-src a{color:var(--ink-2)}
.ev{font-size:10.5px;font-weight:750;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;white-space:nowrap;flex:none}
.ev.s{background:var(--jade-soft);color:var(--jade-strong)}
.ev.m{background:color-mix(in srgb,var(--s2) 16%,var(--card));color:var(--ink)}
.ev.w{background:var(--ochre-soft);color:var(--ochre)}

/* ---------- sheet / toast / banners ---------- */
.sheet-scrim{position:fixed;inset:0;z-index:80;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet-scrim.enter{animation:fade .16s ease}
.sheet{width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow:auto;background:var(--card);border-radius:20px 20px 0 0;padding:0 16px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow-2);overscroll-behavior:contain}
.sheet-scrim.enter .sheet{animation:rise .22s cubic-bezier(.2,.8,.2,1)}
@media (min-width:700px){.sheet-scrim{align-items:center;padding:24px}.sheet{border-radius:20px;padding:0 22px 22px}}
.sheet-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 0 12px;background:var(--card)}
.sheet-title{font-family:var(--font-display);font-size:20px;font-weight:740;letter-spacing:-.015em}
.sheet-body{display:flex;flex-direction:column;gap:16px}
.sheet-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
.cat-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
@media (min-width:520px){.cat-grid{grid-template-columns:repeat(6,minmax(0,1fr))}}
.cat-opt{display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 3px;border-radius:11px;border:1px solid var(--line);background:var(--raised);font-size:11.5px;font-weight:650;color:var(--ink-2);cursor:pointer;text-align:center;line-height:1.2;min-width:0;overflow-wrap:anywhere}
.cat-opt .ico{width:20px;height:20px}
.cat-opt:hover{border-color:var(--ink-3)}
.cat-opt[aria-pressed="true"]{border-color:var(--jade);background:var(--jade-wash);color:var(--jade-strong);box-shadow:inset 0 0 0 1px var(--jade)}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabbar-h) + 14px + env(safe-area-inset-bottom,0px));z-index:110;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(calc(100vw - 32px),440px);pointer-events:none}
@media (min-width:960px){.toasts{bottom:24px}}
.toast{pointer-events:auto;display:flex;align-items:center;gap:14px;background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:12px;box-shadow:var(--shadow-2);font-size:14px;font-weight:550;animation:rise .2s ease}
.toast button{border:0;background:none;color:inherit;font-weight:750;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:0;white-space:nowrap}
.banner{display:flex;align-items:center;justify-content:space-between;gap:10px 14px;flex-wrap:wrap;padding:11px 14px;border-radius:13px;background:var(--ochre-soft);color:var(--ink);font-size:13.5px;margin-bottom:14px}
.banner.info{background:var(--sunken);color:var(--ink-2)}
@keyframes rise{from{transform:translateY(18px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* ---------- onboarding ---------- */
.onboard{max-width:640px;margin:0 auto;padding:18px 0 24px;display:flex;flex-direction:column;gap:22px}
.ob-brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:760;font-size:20px;letter-spacing:-.025em}
.ob-brand svg{width:32px;height:32px}
.ob-title{font-size:clamp(32px,8vw,48px);font-weight:780;letter-spacing:-.035em;line-height:1.02}
.ob-lede{font-size:16.5px;color:var(--ink-2);max-width:52ch}
.ob-points{display:grid;gap:14px}
.ob-point{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;align-items:start}
.ob-point .n{width:34px;height:34px;border-radius:10px;background:var(--jade-soft);color:var(--jade-strong);display:grid;place-items:center;font-weight:750;font-size:14px}
.ob-point b{display:block;font-size:15px}
.ob-point span{font-size:14px;color:var(--ink-2)}
.ob-steps{display:flex;gap:6px;flex:1}
.ob-top{display:flex;align-items:center;gap:14px}
.ob-brand .lang-seg{margin-left:auto}
/* language switch: EN | RO */
.lang-seg{flex:none;flex-wrap:nowrap;font-family:var(--font-ui);letter-spacing:0}
.topbar .brand{white-space:nowrap;min-width:0}
@media (max-width:460px){.top-actions .status-t{display:none}.top-actions .status{padding:6px}}
.lang-seg button{padding:5px 9px;font-size:12px;letter-spacing:.02em}
#lang-top{display:inline-flex}
.top-lang{padding:2px;border-radius:9px}
.top-lang button{padding:4px 7px;font-size:11.5px;border-radius:7px}
.rail-lang{align-self:flex-start;margin:0 6px}
.ob-steps span{height:4px;flex:1;border-radius:2px;background:var(--line)}
.ob-steps span.on{background:var(--jade)}
.ob-nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.ob-example{position:relative}
.ob-example .tagline{position:absolute;top:12px;right:12px;z-index:2}
.skeleton{display:flex;flex-direction:column;gap:12px}
.skeleton i{display:block;height:14px;border-radius:7px;background:var(--sunken)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="layout" id="layout">
  <header class="topbar">
    <button class="brand" type="button" data-act="go" data-to="today" aria-label="Lei Compass, go to Today"><svg viewBox="0 0 32 32" aria-hidden="true"><circle class="bm-disc" cx="16" cy="16" r="15"/><path class="bm-n" d="M16 4.8 19.6 16h-7.2z"/><path class="bm-s" d="M16 27.2 12.4 16h7.2z"/><circle class="bm-c" cx="16" cy="16" r="2"/></svg><span>Lei Compass</span></button>
    <div class="top-actions"><span id="lang-top"></span><span id="status-top"></span><button class="icon-btn" type="button" data-act="settings" aria-label="Settings" id="top-settings"></button></div>
  </header>
  <nav class="rail" id="rail" aria-label="Main"></nav>
  <main id="main" tabindex="-1"></main>
  <aside id="coach-dock" aria-label="AI coach"></aside>
</div>
<nav class="tabbar" id="tabbar" aria-label="Main"></nav>
<div id="coach-park"></div>
<div id="sheet-root"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script>
/* ===================== Lei Compass: fixed data ===================== */
const CATS = {
  housing:  {label:'Housing', hint:'Cămin, rent, utilities', fixed:true, tag:'need', icon:'home'},
  groceries:{label:'Groceries', tag:'need', icon:'cart'},
  eatout:   {label:'Eating out & delivery', short:'Eating out', tag:'want', icon:'fork'},
  transport:{label:'Transport', tag:'need', icon:'bus'},
  bills:    {label:'Phone & bills', fixed:true, tag:'need', icon:'phone'},
  subs:     {label:'Subscriptions', fixed:true, tag:'want', icon:'repeat'},
  study:    {label:'Study', tag:'need', icon:'book'},
  social:   {label:'Social & going out', short:'Social', tag:'want', icon:'glass'},
  shopping: {label:'Shopping', tag:'want', icon:'bag'},
  health:   {label:'Health & care', tag:'need', icon:'heart'},
  fun:      {label:'Fun & hobbies', short:'Fun', tag:'want', icon:'note'},
  other:    {label:'Other', tag:'want', icon:'dots'}
};
const CAT_IDS = Object.keys(CATS);
const TAGS = {
  need:{label:'Need', hint:'You would have to pay for it anyway'},
  value:{label:'Value', hint:'A want that really matters to you'},
  want:{label:'Want', hint:'Nice to have'}
};
const TAG_ORDER = ['need','value','want']; /* matches chart slots s1, s2, s3 (validated adjacency) */
const MOODS = {planned:'Planned', social:'With friends', happy:'Celebrating', bored:'Bored', stressed:'Stressed', sad:'Down', tired:'Tired', hungry:'Hungry'};
const METHODS = {card:'Card', phone:'Phone or watch', cash:'Cash', bnpl:'Buy now, pay later', transfer:'Bank transfer'};
const RATINGS = {1:'Regret it', 2:'Meh', 3:'Okay', 4:'Good', 5:'Loved it'};
const TOD = {morning:'Morning (5–12)', afternoon:'Afternoon (12–17)', evening:'Evening (17–22)', late:'Late night (22–5)'};

const ICON_PATHS = {
  home:'<path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1z"/>',
  cart:'<path d="M3 4h2.2l2.1 10.2a1 1 0 0 0 1 .8h8.9a1 1 0 0 0 1-.76L20 8H6.2"/><circle cx="9.5" cy="19" r="1.4"/><circle cx="16.5" cy="19" r="1.4"/>',
  fork:'<path d="M7 3v6.5a2 2 0 0 0 2 2V21M11 3v6.5a2 2 0 0 1-2 2M9 3v5.5M17 21V3c-2.2.8-3.5 3.4-3.5 6.5V13H17"/>',
  bus:'<rect x="5" y="3.5" width="14" height="14" rx="2.5"/><path d="M5 11h14M8 17.5V20M16 17.5V20M8.5 14.3h.01M15.5 14.3h.01"/>',

/* g: group, ev: evidence, t: title, what / ex / fix: text, go: where it lives in the app, gl: button label, src: source keys */
const LEARN = [
  {id:'mental-accounting', g:'brain', ev:'s', t:'Mental accounting', what:'We sort money into mental jars (rent money, fun money, gift money) and treat each jar differently, even though a leu is a leu.', ex:'300 lei from your grandmother feels like bonus money and is gone after one night out, while you would never spend 300 lei of your allowance that way.', fix:'Use the jars on purpose. Give every leu a job on the day it arrives, and treat windfalls as income: split them, for example half to a goal.', go:'money/plan', gl:'Open your plan', src:['thaler']},
  {id:'present-bias', g:'brain', ev:'s', t:'Present bias', what:'A reward now feels much bigger than the same reward next month.', ex:'You order 45-lei delivery tonight even though you planned to save for the train ticket home.', fix:'Decide in advance: an automatic transfer on allowance day, a waiting period for wants, and goals with a name and a date.', go:'goals/wait', gl:'Open the wait list', src:['smart']},
  {id:'loss-aversion', g:'brain', ev:'s', t:'Loss aversion', what:'Losing something hurts more than gaining the same thing feels good.', ex:'When a free trial ends, cancelling a 39.99-lei subscription feels like losing it, so you keep paying.', fix:'Ask: would I sign up today, at full price? Set a reminder before every free trial ends.', go:'money/subs', gl:'Check subscriptions', src:['kahneman']},
  {id:'pain-of-paying', g:'brain', ev:'m', t:'The pain of paying', what:'Paying hurts a little, and that small pain holds spending back. Cards, phones, saved cards and buy-now-pay-later dull it. A 2024 meta-analysis of 71 papers found a small but real "cashless effect", strongest for show-off purchases. In older auction studies, people offered up to twice as much when paying by credit card.', ex:'Tapping your phone for a 22-lei coffee does not feel like spending. Counting out 22 lei in coins would.', fix:'Turn on instant payment notifications, log purchases yourself, and use cash or a separate card for the categories where you overspend.', go:'today', gl:'Log a purchase', src:['cashless','prelec']},
  {id:'anchoring', g:'brain', ev:'s', t:'Anchoring', what:'The first price you see becomes your reference point.', ex:'"Was 499 lei, now 249 lei" makes 249 feel cheap, even if the jacket was never worth 499.', fix:'Ask what you would pay if you had never seen the old price, and compare across shops.', go:'goals/wait', gl:'Open the wait list', src:[]},
  {id:'decoy', g:'brain', ev:'m', t:'Decoy pricing', what:'A deliberately bad option makes the pricier one look smart.', ex:'A medium popcorn priced almost like the large one.', fix:'Ignore the middle option and choose between the other two.', src:[]},
  {id:'zero-price', g:'brain', ev:'m', t:'The "free" effect', what:'"Free" excites us far more than a tiny price does.', ex:'You add a 30-lei item to your basket to get free delivery instead of paying a 15-lei fee.', fix:'Compare the real totals. Would you buy that item anyway?', src:[]},
  {id:'denomination', g:'brain', ev:'m', t:'Denomination effect', what:'We spend coins and small notes more easily than one large note.', ex:'A 100-lei note stays in your wallet all week. Five 20s are gone by Friday.', fix:'Take fun cash in larger notes, and keep fun money in its own pot so you can see it shrink.', go:'goals/goals', gl:'Open goals', src:[]},
  {id:'sunk-cost', g:'brain', ev:'m', t:'Sunk cost', what:'We keep spending because we "already paid".', ex:'You go to a 150-lei concert you no longer want to see, then spend another 100 lei on a taxi and drinks.', fix:'Only ask about the future: from now on, is this worth it?', src:[]},
  {id:'choice-overload', g:'brain', ev:'w', t:'Choice overload', what:'Too many options can lead to paralysis or regret. But a large meta-analysis found the average effect is close to zero; it only shows up in some situations.', ex:'Forty tabs of headphones open, and you still buy the wrong pair.', fix:'Set your criteria and a price limit before you start browsing.', src:['scheibehenne']},
  {id:'scarcity', g:'brain', ev:'m', t:'Scarcity mindset', what:'When money is tight, attention narrows onto the urgent problem. Some lab results behind this idea are contested, but the broad point holds: money stress uses up attention.', ex:'In exam season, with 80 lei left for 10 days, you accept a buy-now-pay-later offer without reading it.', fix:'Keep a small emergency buffer, and make money decisions at a calm time, like your weekly review.', go:'goals/goals', gl:'Start a buffer', src:['scarcity']},
  {id:'willpower', g:'brain', ev:'w', t:'Willpower is not a battery', what:'The idea that self-control runs out during the day ("ego depletion") failed a 23-lab replication: the effect was close to zero.', ex:'Promising yourself to "be stronger next week" rarely changes anything.', fix:'Build your system on defaults, automation and friction instead of willpower.', go:'money/plan', gl:'Open your plan', src:['hagger']},

  {id:'emotional', g:'feel', ev:'m', t:'Emotional spending', what:'Buying to fix a mood. The lift is short and often followed by regret. For students, stress and boredom are the usual triggers.', ex:'A 120-lei order the night before an exam.', fix:'Tag the mood behind your purchases. After a month you will see your own pattern. Keep a free "mood menu" ready: a walk, a call with a friend, the gym.', go:'insights/patterns', gl:'See mood patterns', src:[]},
  {id:'social', g:'feel', ev:'m', t:'Peer pressure and FOMO', what:'First year brings new friends and pressure to say yes to everything. Morgan Housel calls the hidden cost of keeping up "social debt".', ex:'Three dinners out in one week because everyone else was going.', fix:'Set a weekly social amount, keep a line ready ("I’m in for the walk, skipping dinner this week"), and suggest cheaper plans.', go:'coach/ask', gl:'Ask Compass for cheap plans', src:['housel']},
  {id:'social-media', g:'feel', ev:'m', t:'Social media and influencers', what:'Influencer posts mix friendship and advertising, and young people are a main target.', ex:'A creator you like "just loves" a 200-lei serum.', fix:'Unfollow accounts that make you feel behind. Put tempting links on your wait list instead of buying.', go:'goals/wait', gl:'Open the wait list', src:[]},
  {id:'impulse', g:'feel', ev:'m', t:'Impulse or compulsive buying', what:'Impulse buys are common and usually harmless. Compulsive buying is different: a 2016 meta-analysis estimated it affects about 5% of adults, more among young people and students.', ex:'Shopping feels out of control, you hide purchases, or you borrow to shop.', fix:'If that sounds like you, talk to your university’s counseling service. It is common and help works.', src:['maraz']},
  {id:'adaptation', g:'feel', ev:'s', t:'Lifestyle creep', what:'We get used to new things fast (hedonic adaptation). When income rises, spending quietly rises to match.', ex:'The new phone feels amazing for three weeks. After that it is just your phone.', fix:'When your income rises, save part of the raise automatically, and space treats out so they stay special.', go:'money/plan', gl:'Open your plan', src:[]},
  {id:'status', g:'feel', ev:'m', t:'Status spending', what:'We buy to show who we are. The cashless effect is strongest for show-off purchases.', ex:'Paying 150 lei extra for the logo.', fix:'Ask yourself: would I still buy this if nobody could ever see it?', go:'goals/wait', gl:'Open the wait list', src:['cashless','housel']},
  {id:'money-scripts', g:'feel', ev:'m', t:'Money scripts', what:'Beliefs about money we learn growing up, such as "money is bad", "more money fixes everything" or "my worth is my net worth".', ex:'You hide purchases because money was a tense topic at home.', fix:'Write down three money sentences you heard growing up, and ask whether they still help you.', go:'coach/learn#story', gl:'Write your money story', src:['klontz']},

  {id:'subscriptions', g:'traps', ev:'m', t:'Subscription creep', what:'Small amounts that repeat escape attention, and cancelling feels like a loss. The EU found online shops hiding information to push people into subscriptions.', ex:'Four subscriptions of 10–40 lei that you forgot about cost over 1,000 lei a year.', fix:'List every subscription with its renewal date and check the list once a month.', go:'money/subs', gl:'Check subscriptions', src:['eusweep']},
  {id:'bnpl', g:'traps', ev:'m', t:'Buy now, pay later', what:'It splits the pain of paying into small pieces and moves it into the future. US data from the consumer agency CFPB (2025) showed about 63% of BNPL borrowers had several loans open at once, and for 18–24-year-olds BNPL was 28% of unsecured debt.', ex:'Three small "pay in 4" plans that all charge you in the same week.', fix:'Never use buy-now-pay-later for wants. If you can’t pay today, you can’t afford it today.', go:'insights/patterns', gl:'See how you pay', src:['cfpb']},
  {id:'dark-patterns', g:'traps', ev:'m', t:'Fake urgency and dark patterns', what:'Shops design checkouts to rush you. An EU check of 399 online shops in 2023 found 148 using manipulative designs, including 42 with fake countdown timers.', ex:'"Only 2 left! Offer ends in 09:59."', fix:'Slow down at checkout, untick extras, and remember that real deals come back.', go:'goals/wait', gl:'Open the wait list', src:['eusweep']},
  {id:'one-click', g:'traps', ev:'m', t:'Saved cards and delivery apps', what:'Saved cards, one-click checkout, delivery apps and in-game coins remove friction and hide real prices.', ex:'"500 gems" sounds like nothing. It costs 49.99 lei.', fix:'Delete saved cards, set a weekly limit for delivery, and convert coins into lei before buying.', go:'today', gl:'Log a purchase', src:[]},

  {id:'experiences', g:'happy', ev:'m', t:'Buy experiences', what:'Experiences tend to satisfy for longer than things: they become stories, they are shared, and they are hard to compare.', ex:'A day trip with friends usually beats a second hoodie.', fix:'When you choose between two wants, lean toward the experience.', go:'insights/patterns', gl:'See your worth-it ratings', src:['vanboven']},
  {id:'buy-time', g:'happy', ev:'m', t:'Buy time', what:'Paying to skip a task you hate can lift your mood. In a field experiment, people felt happier after a time-saving purchase than after buying a thing.', ex:'The direct bus instead of a long walk with three changes.', fix:'Spend on saving time for the tasks you hate most. Daily delivery is not what this means.', src:['whillans']},
  {id:'treat', g:'happy', ev:'m', t:'Make it a treat', what:'Limiting a pleasure keeps it fresh, and looking forward to something is part of the joy. Pay now, enjoy later.', ex:'Cinema every Friday becomes routine. Once a month it feels special.', fix:'Space treats out, and book fun things early so you enjoy the waiting.', src:['dunn']},
  {id:'others', g:'happy', ev:'m', t:'Spend on others', what:'Spending on other people tends to feel good. The effect is real but smaller than early studies claimed.', ex:'Buying a friend a coffee after their exam.', fix:'Keep a small amount for other people inside your fun money.', src:['aknin']},
  {id:'fit', g:'happy', ev:'m', t:'Spending that fits you', what:'A study of about 77,000 UK bank transactions found that spending that matches your personality goes with higher life satisfaction. The effect is small, and it means there is no single right way to spend.', ex:'One friend loves gear, another loves trips. Both can be right.', fix:'Rate your purchases a few days later and spend more on what you rate highly.', go:'insights/patterns', gl:'See your worth-it ratings', src:['matz']},

  {id:'pay-first', g:'works', ev:'s', t:'Pay yourself first, automatically', what:'Move savings out on the day money arrives, before you can spend it. In "Save More Tomorrow", people who committed in advance raised their saving rate from 3.5% to 13.6% over 40 months.', ex:'A standing order of 200 lei to savings on allowance day.', fix:'Set your savings amount in the plan, then create a standing order in your bank app.', go:'money/plan', gl:'Set it in your plan', src:['smart']},
  {id:'pots', g:'works', ev:'s', t:'Labeled pots for goals', what:'Money with a name is harder to spend. In a field experiment, splitting savings into two labeled envelopes raised savings by about 72%. Setting goals in a finance app raised saving too, most for people who saved least.', ex:'A pot called "Laptop, June" instead of "savings".', fix:'Give each goal a name, a target and a date.', go:'goals/goals', gl:'Open goals', src:['soman','gargano']},
  {id:'budget', g:'works', ev:'m', t:'A budget, even an imperfect one', what:'App users who set budgets spent less, and were still spending less six months later, even though most went over. But a 13-week test with 9,035 users found no difference, and people spent 1.3–1.4 times what they planned. Budgets help; they are not magic.', ex:'Your weekly budget is 320 lei and you spend 360. That is still useful information.', fix:'Use a weekly budget, look at it before you spend, and adjust it instead of giving up on it.', go:'today', gl:'See safe to spend today', src:['budgets','irrational']},
  {id:'visibility', g:'works', ev:'m', t:'Make spending visible', what:'People who installed a finance app on their phone cut their discretionary spending, most of all in the evening and among people with lower self-control.', ex:'Seeing "safe to spend today: 40 lei" before you order.', fix:'Glance at Today before you spend, and log purchases as they happen.', go:'today', gl:'Open Today', src:['levi']},
  {id:'reminders', g:'works', ev:'s', t:'Reminders that name your goal', what:'In field experiments with three banks, reminders raised saving by 6% and made people 3 points more likely to reach their goal. Reminders that named the goal worked best.', ex:'"Laptop: 450 lei to go."', fix:'Keep your goals named and in sight.', go:'today', gl:'Open Today', src:['karlan']},
  {id:'if-then', g:'works', ev:'s', t:'If-then plans', what:'Deciding your response to a trigger ahead of time ("If X happens, then I will do Y") had a medium-to-large effect on reaching goals across 94 studies.', ex:'If I open a delivery app after 22:00, then I make toast and add the order to my wait list.', fix:'Write one if-then plan in every weekly review.', go:'insights/review', gl:'Do a weekly review', src:['gollwitzer']},
  {id:'friction', g:'works', ev:'m', t:'Add friction', what:'Every extra step gives your slower, more careful thinking a chance to speak.', ex:'With no saved card you have to type 16 digits, and often you decide not to.', fix:'Delete saved cards, unsubscribe from shop emails, and remove shopping apps from your home screen.', src:['cashless']},
  {id:'waiting', g:'works', ev:'w', t:'Waiting periods', what:'Most urges fade, and fake urgency gets exposed. Few trials test waiting directly, but it targets well-documented impulse and urgency effects.', ex:'The 480-lei sneakers look a lot less urgent on day 30.', fix:'Wait 24 hours for small buys, 7 days for medium ones and 30 days for big ones.', go:'goals/wait', gl:'Open the wait list', src:[]},

/* ===================== language: English / Română =====================
   L(en, ro) picks text built in code. Fixed labels (categories, moods, Learn cards, dates)
   are swapped in place. Plain interface text is translated on the page by RO_TEXT below,
   and put back exactly as it was when you switch to English. */
const LS_LANG = 'leicompass.v1.lang';
let LANG = (() => {
  try { const v = localStorage.getItem(LS_LANG); if (v === 'en' || v === 'ro') return v; } catch (e){}
  const n = (navigator.languages && navigator.languages[0]) || navigator.language || '';
  return /^ro\b/i.test(n) ? 'ro' : 'en';
})();
function L(en, ro){ return LANG === 'ro' ? ro : en; }
/* Romanian counting: 1 zi, 2–19 zile, 20+ „de” zile (and 101–119 again without „de”) */
function roN(n, one, other){
  const k = Math.abs(Math.round(+n || 0));
  if (k === 1) return '1 ' + one;
  const r = k % 100;
  return NF0.format(k) + ((k === 0 || (r >= 1 && r <= 19)) ? ' ' : ' de ') + other;
}
/* English counting */
function enN(n, one, other){ const k = Math.round(+n || 0); return NF0.format(k) + ' ' + (k === 1 ? one : other); }

const DATA_EN = {};
function snapData(){
  const pick = (o, ks) => Object.fromEntries(ks.filter(k => k in o).map(k => [k, o[k]]));
  DATA_EN.CATS = Object.fromEntries(Object.keys(CATS).map(k => [k, pick(CATS[k], ['label', 'hint', 'short'])]));
  DATA_EN.TAGS = Object.fromEntries(Object.keys(TAGS).map(k => [k, Object.assign(pick(TAGS[k], ['label', 'hint']), {plural: TAGS[k].label + 's'})]));
  const objs = {MOODS, METHODS, RATINGS, TOD, EV, EV_SHORT};
  for (const k in objs) DATA_EN[k] = Object.assign({}, objs[k]);
  DATA_EN.GROUPS = Object.fromEntries(Object.keys(GROUPS).map(k => [k, GROUPS[k].label]));
  DATA_EN.WD = WD.slice(); DATA_EN.WDL = WDL.slice(); DATA_EN.MON = MON.slice(); DATA_EN.MONL = MONL.slice();
  DATA_EN.CHECKLIST = Object.fromEntries(CHECKLIST.map(([k, l]) => [k, l]));
  DATA_EN.COACH_CHIPS = COACH_CHIPS.slice();
  DATA_EN.LEARN = Object.fromEntries(LEARN.map(c => [c.id, pick(c, ['t', 'what', 'ex', 'fix', 'gl'])]));
}
function applyDataLang(){
  if (!DATA_EN.CATS) snapData();
  const D = LANG === 'ro' ? DATA_RO : DATA_EN;
  for (const k in CATS){ const src = Object.assign({}, DATA_EN.CATS[k], D.CATS[k]); for (const f of ['label', 'hint', 'short']){ if (src[f] != null) CATS[k][f] = src[f]; else delete CATS[k][f]; } }
  for (const k in TAGS) Object.assign(TAGS[k], DATA_EN.TAGS[k], D.TAGS[k]);
  const objs = {MOODS, METHODS, RATINGS, TOD, EV, EV_SHORT};
  for (const name in objs) Object.assign(objs[name], DATA_EN[name], D[name]);
  for (const k in GROUPS) GROUPS[k].label = D.GROUPS[k] || DATA_EN.GROUPS[k];
  const arrs = {WD, WDL, MON, MONL};
  for (const name in arrs) arrs[name].splice(0, arrs[name].length, ...(D[name] || DATA_EN[name]));
  for (const row of CHECKLIST) row[1] = D.CHECKLIST[row[0]] || DATA_EN.CHECKLIST[row[0]];
  COACH_CHIPS.splice(0, COACH_CHIPS.length, ...D.COACH_CHIPS);
  for (const c of LEARN){
    const src = Object.assign({}, DATA_EN.LEARN[c.id], LANG === 'ro' ? DATA_RO.LEARN[c.id] : {});
    for (const f of ['t', 'what', 'ex', 'fix', 'gl']){ if (src[f] != null) c[f] = src[f]; }
  }
}

/* ---------- translating what is on the page ---------- */
const TR_ATTRS = ['placeholder', 'aria-label', 'title', 'data-tip', 'data-tipv', 'alt'];
const trTextOrig = new WeakMap(), trTextDone = new WeakMap(), trAttrState = new WeakMap();
let RO_MAP = null;
function roMap(){
  if (!RO_MAP){ RO_MAP = new Map(); for (const k in RO_TEXT) RO_MAP.set(k.replace(/\s+/g, ' ').trim(), RO_TEXT[k]); }
  return RO_MAP;
}
function roText(s){
  const key = String(s).replace(/\s+/g, ' ').trim();
  if (!key || !/[A-Za-z]/.test(key)) return null;
  const r = roMap().get(key);
  if (r == null) return null;
  const lead = /^\s/.test(s) ? ' ' : '', trail = /\s$/.test(s) ? ' ' : '';
  return lead + r + trail;
}
function trSkip(el){ return !el || !!el.closest('script,style,textarea,[translate="no"],.md'); }
function trNode(n){
  const p = n.parentElement; if (!p || trSkip(p)) return;
  const cur = n.data;
  if (trTextDone.get(n) === cur) return;
  const out = roText(cur);
  if (out == null || out === cur) return;
  trTextOrig.set(n, cur); trTextDone.set(n, out); n.data = out;
}
function trAttr(el, a){
  if (!el.hasAttribute(a) || el.closest('[translate="no"],.md')) return;
  const cur = el.getAttribute(a);
  const st = trAttrState.get(el) || {};
  if (st[a] && st[a][1] === cur) return;
  const out = roText(cur);
  if (out == null || out === cur) return;
  st[a] = [cur, out]; trAttrState.set(el, st);
  el.setAttribute(a, out);
}
function trTree(root){
  if (LANG !== 'ro' || !root) return;
  if (root.nodeType === 3){ trNode(root); return; }
  if (root.nodeType !== 1) return;
  for (const a of TR_ATTRS) trAttr(root, a);
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT | NodeFilter.SHOW_ELEMENT);
  let n;
  while ((n = w.nextNode())){
    if (n.nodeType === 3) trNode(n);
    else for (const a of TR_ATTRS) if (n.hasAttribute(a)) trAttr(n, a);
  }
}
function trRestore(root){
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT | NodeFilter.SHOW_ELEMENT);
  let n;
  while ((n = w.nextNode())){
    if (n.nodeType === 3){ if (trTextDone.get(n) === n.data){ n.data = trTextOrig.get(n); } trTextDone.delete(n); trTextOrig.delete(n); continue; }
    const st = trAttrState.get(n); if (!st) continue;
    for (const a in st) if (n.getAttribute(a) === st[a][1]) n.setAttribute(a, st[a][0]);
    trAttrState.delete(n);
  }
}
let trObs = null;
function startTranslator(){
  if (trObs || typeof MutationObserver === 'undefined') return;
  trObs = new MutationObserver(recs => {
    if (LANG !== 'ro') return;
    for (const r of recs){
      if (r.type === 'characterData') trNode(r.target);
      else if (r.type === 'attributes') trAttr(r.target, r.attributeName);
      else for (const n of r.addedNodes) trTree(n);
    }
  });
  trObs.observe(document.body, {subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: TR_ATTRS});
  trTree(document.body);
}

  return html`<div class="seg lang-seg ${extra || ''}" role="group" aria-label="Language / Limba" translate="no">${[['en', 'EN', 'English'], ['ro', 'RO', 'Română']].map(([k, l, t]) => html`<button type="button" data-act="lang" data-lang="${k}" lang="${k}" title="${t}" aria-pressed="${LANG === k ? 'true' : 'false'}">${l}</button>`)}</div>`;
}

const KW_INCOME = W('salar|salary|burs[aă]|scholarship|allowance|from (?:mom|dad|my parents|parents)|de la (?:mama|tata|p[aă]rin[tț]i)|got paid|primit|received|income|venit|refund');
const KW_SAVE = W('saved|put aside|economisit|pus deoparte|to savings|pu[sș]culi[tț][aă]');
const KW_MOOD = [['bored', W('bored|plictis')], ['stressed', W('stress|stres|exam|sesiune')], ['sad', W('sad|trist|down')], ['tired', W('tired|obosit|exhausted')], ['hungry', W('hungry|foame|fl[aă]m[aâ]nd')], ['social', W('friends|prieteni|colegi|with my|cu prietenii|date')], ['happy', W('celebrat|s[aă]rb[aă]t|birthday|zi de na[sș]tere')], ['planned', W('planned|planificat')]];
const KW_METHOD = [['cash', W('cash|numerar|cu bani')], ['bnpl', W('bnpl|pay later|[iî]n rate|klarna|mokka|tbi')], ['phone', W('apple pay|google pay|phone pay|cu telefonul|watch')], ['card', W('card')]];
function ruleParse(text, t, m){
  const parts = String(text).split(/[;\n]|,(?!\d)|\s+(?:and|și|si|plus)\s+(?=\D*\d)/i).map(s => s.trim()).filter(Boolean);
  const items = [];
  let date = t;
  if (W('day before yesterday|alalt[aă]ieri').test(text)) date = addDays(t, -2);
  else if (W('yesterday|ieri').test(text)) date = addDays(t, -1);
  for (const seg of parts){
    const nm = seg.match(/(\d+(?:[.,]\d{1,2})?)/);
    if (!nm) continue;
    const amount = parseAmount(nm[1]);
    if (!isFinite(amount) || amount <= 0) continue;
    let type = KW_INCOME.test(seg) ? 'income' : KW_SAVE.test(seg) ? 'save' : 'expense';
    let category = 'other';
    for (const [c, re] of KW) if (re.test(seg)){ category = c; break; }
    let mood = '';
    for (const [k, re] of KW_MOOD) if (re.test(seg)){ mood = k; break; }
    let method = '';
    for (const [k, re] of KW_METHOD) if (re.test(seg)){ method = k; break; }
    const note = seg.replace(nm[0], '').replace(/\b(lei|leu|ron)\b/ig, '').replace(/\s{2,}/g, ' ').replace(/^[\s,.:-]+|[\s,.:-]+$/g, '').slice(0, 48);
    const dials = (m && m.plan.dials) || [];
    const tag = type === 'expense' ? (dials.includes(category) ? 'value' : CATS[category].tag) : '';
    items.push({type, amount: round2(amount), category, tag, mood, method, note, date, time: date === t ? nowHM() : '', fixed: type === 'expense' && !!CATS[category].fixed, goalId: type === 'save' && m && m.goals[0] ? m.goals.filter(g => !g.archived)[0]?.id || '' : '', source: type === 'income' ? note : ''});
  }
  return items;
}
function cleanAiItems(raw, t, m){
  const arr = Array.isArray(raw && raw.items) ? raw.items : Array.isArray(raw) ? raw : [];
  const firstGoal = m.goals.filter(g => !g.archived)[0];
  return arr.slice(0, 10).map(x => {
    if (!isObj(x)) return null;
    const type = ['expense', 'income', 'save'].includes(x.type) ? x.type : 'expense';
    let amount = Math.abs(parseAmount(x.amount));
    if (!isFinite(amount) || amount <= 0) return null;
    amount = round2(amount);
    const category = CATS[x.category] ? x.category : 'other';
    const date = isYmd(x.date) && x.date <= addDays(t, 1) && x.date >= addDays(t, -90) ? x.date : t;
    return {
      type, amount, category,
      tag: type === 'expense' ? (TAGS[x.tag] ? x.tag : CATS[category].tag) : '',
      mood: MOODS[x.mood] ? x.mood : '', method: METHODS[x.method] ? x.method : '',
      note: String(x.note || '').slice(0, 60), date,
      time: /^\d{2}:\d{2}$/.test(x.time || '') ? x.time : (date === t ? nowHM() : ''),
      fixed: type === 'expense' && !!CATS[category].fixed,
      goalId: type === 'save' && firstGoal ? firstGoal.id : '', source: type === 'income' ? String(x.note || '').slice(0, 40) : ''
    };
  }).filter(Boolean);
}
function parsePrompt(text, m){
  const t = m.today;
  return 'Turn a student’s note into entries for a budgeting app. Money is in lei (RON). Today is ' + WDL[parseYmd(t).getDay()] + ' ' + t + ', time now ' + nowHM() + '.\n' +
    'Reply with only JSON: {"items":[{"type":"expense"|"income"|"save","amount":number,"category":string,"tag":"need"|"want"|"value","mood":string|null,"method":string|null,"note":string,"date":"YYYY-MM-DD","time":"HH:MM"|null}],"question":string|null}\n' +
    'Categories (use the id): housing (rent, cămin, utilities), groceries, eatout (restaurants, coffee, fast food, delivery), transport, bills (phone, internet), subs (subscriptions), study, social (going out, bars, events with friends), shopping (clothes, tech, gifts), health (pharmacy, doctor, gym, haircut, personal care), fun (hobbies, games, cinema), other.\n' +
    'tag: need = necessary; want = nice to have; value = a want that really matters to the student. Their favourite categories ("money dials") are: ' + (m.plan.dials.map(d => d).join(', ') || 'none set') + '.\n' +
    'mood: planned, social, happy, bored, stressed, sad, tired, hungry, or null when the note does not suggest one ("with friends" means social).\n' +
    'method: card, phone, cash, bnpl, transfer, or null when not said.\n' +
    'Rules: one item per purchase; amounts are positive numbers; turn words like "yesterday" into real dates; note is a short label (max 40 characters) in the student’s language; type "income" for money received (parents, bursă, salary), "save" for money put aside; if a purchase has no amount, leave it out and ask about it in "question".\n' +

}

let renderQueued = false;

function needsOnboarding(){ const S = DOCS() && DOCS().settings; return Store.ready && !Store.demo && !(S && S.onboarded); }
function viewKey(){
  if (!Store.ready && !Store.demo) return 'connecting';
  if (needsOnboarding()) return 'onboarding';

function render(force){
  const main = $('#main'); if (!main) return;
  const key = viewKey();
  const shell = key === 'connecting' || key === 'onboarding';
  document.body.classList.toggle('is-onboarding', shell);
  renderNav(); renderStatus();
  /* keep the chat (and the keyboard) alive while it is on screen and only data changed */
  if (!force && key === ui.lastView && key === 'coach/ask'){ placeCoach(); return; }
  parkCoach();
  const f = captureFocus(main);
  let view;
  if (key === 'connecting') view = viewConnecting();
  else if (key === 'onboarding') view = viewOnboarding();
  else view = VIEWS[ui.tab]();
  main.innerHTML = str(view);
  restoreFocus(f, main);
  ui.lastView = key;
  placeCoach();
}
function captureFocus(root){
  const a = document.activeElement;
  if (!a || !root.contains(a) || !a.id) return null;
  let s = null, e = null; try { s = a.selectionStart; e = a.selectionEnd; } catch (x){}
  return {id: a.id, s, e};
}
function restoreFocus(f, root){
  if (!f) return;
  const el = root.querySelector('#' + CSS.escape(f.id)); if (!el) return;
  try { el.focus({preventScroll: true}); if (f.s != null && el.setSelectionRange) el.setSelectionRange(f.s, f.e); } catch (x){}
}

function md(text){
  const lines = String(text || '').replace(/\r/g, '').split('\n');
  let out = '', list = null, para = [];
  const inline = s => esc(s).replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/(^|[^*\w])\*([^*\n]+)\*(?!\w)/g, '$1<em>$2</em>');
  const flushP = () => { if (para.length){ out += '<p>' + para.map(inline).join('<br>') + '</p>'; para = []; } };
  const flushL = () => { if (list){ out += '<' + list.t + '>' + list.items.map(i => '<li>' + inline(i) + '</li>').join('') + '</' + list.t + '>'; list = null; } };
  for (const ln of lines){
    const l = ln.replace(/\s+$/, ''); let mm;
    if (!l.trim()){ flushP(); flushL(); continue; }
    if ((mm = l.match(/^\s*#{1,6}\s+(.*)$/))){ flushP(); flushL(); out += '<h4>' + inline(mm[1]) + '</h4>'; continue; }
    if ((mm = l.match(/^\s*[-*•]\s+(.*)$/))){ flushP(); if (!list || list.t !== 'ul'){ flushL(); list = {t: 'ul', items: []}; } list.items.push(mm[1]); continue; }
    if ((mm = l.match(/^\s*\d+[.)]\s+(.*)$/))){ flushP(); if (!list || list.t !== 'ol'){ flushL(); list = {t: 'ol', items: []}; } list.items.push(mm[1]); continue; }
    flushL(); para.push(l);
  }
  flushP(); flushL();
  return raw(out);
}

function refreshAi(key){ const el = document.getElementById('ai-' + key); if (el) el.innerHTML = str(aiBoxInner(key, el.dataset.title || 'Compass')); }
async function aiStream(key, input, opts){
  if (!aiReady()) return;
  const prev = ui.ai[key]; if (prev && prev.ctl) prev.ctl.abort();
  const st = ui.ai[key] = {busy: true, text: '', err: '', ctl: new AbortController()};
  refreshAi(key);
  try {
    const r = await AI.fn(input, Object.assign({}, opts || {}, {signal: st.ctl.signal, onText: u => { st.text = u.text; refreshAi(key); }}));
    st.text = r.text; st.truncated = !!r.truncated;
  } catch (e){ st.text = (e && e.text) || ''; st.err = aiErr(e); aiFatal(e); }
  finally { st.busy = false; st.ctl = null; refreshAi(key); }
}

function niceMax(v){ if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; }
function compactN(n){ return n >= 1000 ? (n / 1000).toLocaleString('ro-RO', {maximumFractionDigits: 1}) + 'k' : NF0.format(Math.round(n)); }
function columnsChart(cols, opts){
  opts = opts || {};
  const max = niceMax(Math.max(opts.ref || 0, 1, ...cols.map(c => c.value)));
  return html`<div class="cols" style="--h:${opts.h || 150}px"><div class="cols-plot">
    <div class="cols-grid" style="bottom:100%"><span>${compactN(max)}</span></div>
    <div class="cols-grid" style="bottom:50%"><span>${compactN(max / 2)}</span></div>
    <div class="cols-grid" style="bottom:0;border-top:0"><span>0</span></div>
    ${opts.ref ? html`<div class="col-ref" style="bottom:${(opts.ref / max * 100).toFixed(2)}%" aria-hidden="true"></div>` : ''}
    ${cols.map(c => html`<div class="col ${c.emph ? 'emph' : c.fill ? 'fill' : ''}" tabindex="0" data-tip="${c.tip}" data-tipv="${c.valText}"><span class="col-bar" style="height:${(c.value / max * 100).toFixed(2)}%"></span><span class="col-x">${c.label}</span></div>`)}
  </div></div>${opts.legend ? html`<div class="legend">${opts.legend}</div>` : ''}`;
}
function dotPlot(rows){
  return html`<div class="dots">${rows.map(r => html`<div class="dot-row" tabindex="0" data-tip="${r.label}" data-tipv="${L(fmt1(r.avg) + ' out of 5 · ' + r.n + ' ratings', fmt1(r.avg) + ' din 5 · ' + roN(r.n, 'notă', 'note'))}"><span class="bar-label">${r.label}</span><span class="dot-track">${[0, 25, 50, 75, 100].map(p => html`<b style="left:${p}%"></b>`)}<i style="left:${((r.avg - 1) / 4 * 100).toFixed(2)}%"></i></span><span class="dot-val"><b>${fmt1(r.avg)}</b> · ${r.n}×</span></div>`)}

}

function reviewTargetWeek(m){
  const dow = parseYmd(m.today).getDay();
  if (dow === 0) return weekStartOf(m.today);

  return '';
}
function attentionCard(m){
  const rows = [];
  const now = Date.now();
  for (const w of m.wishes) if (w.status === 'waiting' && wishReadyAt(w) <= now) rows.push(html`<div class="nudge"><div class="nudge-top"><span class="cat-ico">${icon('hourglass')}</span><div class="nudge-text"><strong>${w.name}</strong> ${L('(' + leiR(w.price) + ') has waited ' + (w.waitDays === 1 ? '24 hours' : w.waitDays + ' days') + '. Still want it?', '(' + leiR(w.price) + ') a așteptat ' + (w.waitDays === 1 ? '24 de ore' : roN(w.waitDays, 'zi', 'zile')) + '. Încă îl vrei?')}</div></div>
    <div class="row-actions"><button class="btn sm" type="button" data-act="wish-buy" data-id="${w.id}">Buy it</button><button class="btn sm" type="button" data-act="wish-drop" data-id="${w.id}">Let it go</button><button class="btn sm quiet" type="button" data-act="wish-more" data-id="${w.id}">Wait 7 more days</button></div></div>`);
  for (const s of m.subs){
    if (s.active === false) continue;
    const nd = nextRenewal(s, m.today), dd = diffDays(m.today, nd);
    if (dd >= 0 && dd <= 3 && s.ok !== nd) rows.push(html`<div class="nudge"><div class="nudge-top"><span class="cat-ico">${icon('repeat')}</span><div class="nudge-text"><strong>${s.name}</strong> ${L('renews ' + (dd === 0 ? 'today' : dd === 1 ? 'tomorrow' : 'in ' + dd + ' days') + ' (' + lei(s.price) + '). Still worth it?', 'se reînnoiește ' + (dd === 0 ? 'azi' : dd === 1 ? 'mâine' : 'în ' + roN(dd, 'zi', 'zile')) + ' (' + lei(s.price) + '). Încă merită?')}</div></div>
      <div class="row-actions"><button class="btn sm" type="button" data-act="sub-ok" data-id="${s.id}" data-nd="${nd}">Still worth it</button><button class="btn sm quiet" type="button" data-act="sub-cancel" data-id="${s.id}">I cancelled it</button></div></div>`);
  }
  const rw = reviewTargetWeek(m);
  if (rw && !m.reviews.find(r => r.id === weekKey(rw)) && m.tx.some(r => r.date >= rw && r.date < addDays(rw, 7)))
    rows.push(html`<div class="nudge"><div class="nudge-top"><span class="cat-ico">${icon('check')}</span><div class="nudge-text">Your weekly review for <strong>${weekRange(rw)}</strong> is ready. It takes about five minutes.</div></div><div class="row-actions"><button class="btn sm primary" type="button" data-act="review-open" data-w="${rw}">Start the review</button></div></div>`);
  const toRate = m.tx.filter(r => needsRating(r, m.today)).slice(0, 2);
  for (const r of toRate) rows.push(html`<div class="nudge"><div class="nudge-top"><span class="cat-ico">${icon((CATS[r.category] || CATS.other).icon)}</span><div class="nudge-text">Looking back, how do you feel about <strong>${r.note || CATS[r.category].label}</strong> ${'(' + lei(r.amount) + ', ' + dRelIn(r.date, m.today) + ')?'}</div></div>
    <div class="rate" role="group" aria-label="Was it worth it?">${[1, 2, 3, 4, 5].map(v => html`<button class="chip" type="button" data-act="rate" data-id="${r.id}" data-v="${v}">${RATINGS[v]}</button>`)}<button class="btn sm quiet" type="button" data-act="rate-skip" data-id="${r.id}">Skip</button></div></div>`);
  if (!rows.length) return '';
  return html`<section class="card" aria-labelledby="att-h"><div class="section-head"><h2 class="h2" id="att-h">Needs you</h2>${toRate.length ? whyLink('fit', 'Why rate purchases') : ''}</div><div class="list">${rows}</div></section>`;
}

      : emptyState(all.length ? 'Nothing matches' : L('No entries in ', 'Nimic notat în ') + monthLabel(mon), all.length ? 'Try another filter or search.' : 'Add your first entry with the button above, or from Today.')}

function planDraft(S){
  S = S || {};
  const rows = a => (Array.isArray(a) ? a : []).map(r => ({id: r.id || uid('r'), name: r.name || '', amount: fmtInput(r.amount)}));
  return {incomes: rows(S.incomes), fixed: rows(S.fixed), saveFirst: fmtInput(S.saveFirst), override: S.weeklyOverride != null && S.weeklyOverride !== '', weekly: fmtInput(S.weeklyOverride), hourly: fmtInput(S.hourly), dials: Array.isArray(S.dials) ? S.dials.slice() : [], dirty: false};
}
function numOr0(v){ const n = parseAmount(v); return isFinite(n) ? Math.max(0, round2(n)) : 0; }
function planFromDraft(d){
  const rows = a => a.filter(r => String(r.name).trim() || numOr0(r.amount)).map(r => ({id: r.id, name: String(r.name).trim().slice(0, 40) || L('Untitled', 'Fără nume'), amount: numOr0(r.amount)}));
  const w = parseAmount(d.weekly);
  return {incomes: rows(d.incomes), fixed: rows(d.fixed), saveFirst: numOr0(d.saveFirst), weeklyOverride: d.override && isFinite(w) ? Math.max(0, round2(w)) : null, hourly: numOr0(d.hourly), dials: d.dials.filter(x => CATS[x]).slice(0, 3)};
}

function goalCard(g, m){
  const target = +g.target || 0;
  const p = target > 0 ? clamp(g.saved / target, 0, 1) : 0;
  const done = target > 0 && g.saved >= target;
  let pace = '';
  if (isYmd(g.deadline) && !done){
    const days = diffDays(m.today, g.deadline);
    if (days > 0){ const wk = Math.max(1, days / 7); pace = L('By ' + dDate(g.deadline) + ' · ' + leiR((target - g.saved) / wk) + ' a week to get there', 'Până pe ' + dDate(g.deadline) + ' · ' + leiR((target - g.saved) / wk) + ' pe săptămână ca să ajungi'); }
    else pace = L('The date has passed. Pick a new one or keep going at your own pace.', 'Data a trecut. Alege una nouă sau continuă în ritmul tău.');
  }
  return html`<article class="card goal" aria-label="${g.name}">
    <div class="goal-top"><div style="min-width:0"><div class="goal-name">${g.name}</div>${g.why ? html`<div class="goal-why">“${g.why}”</div>` : ''}</div><button class="icon-btn" type="button" data-act="goal-edit" data-id="${g.id}" aria-label="${L('Edit ', 'Editează ') + g.name}">${icon('edit')}</button></div>
    <div class="goal-bar"><span style="width:${(p * 100).toFixed(1)}%"></span></div>
    <div class="goal-nums"><span><b>${leiR(g.saved)}</b> ${L('of ', 'din ') + leiR(target)}</span><span>${done ? html`<span class="pill good">${icon('check')}Reached</span>` : pctS(p)}</span></div>
    ${pace ? html`<div class="hint">${pace}</div>` : ''}
    <div class="row-actions"><button class="btn sm primary" type="button" data-act="goal-add" data-id="${g.id}">Add money</button><button class="btn sm quiet" type="button" data-act="goal-out" data-id="${g.id}">Take out</button>${done ? html`<button class="btn sm quiet" type="button" data-act="goal-archive" data-id="${g.id}">Archive</button>` : ''}</div>
  </article>`;
}

/* ===================== INSIGHTS: weekly review ===================== */
function reviewData(m, start){
  const end = addDays(start, 7);
  const tx = m.tx.filter(r => r.date >= start && r.date < end);
  const flex = tx.filter(r => r.type === 'expense' && !r.fixed);
  const byCat = {};
  for (const r of flex) byCat[r.category] = (byCat[r.category] || 0) + r.amount;
  const rated = flex.filter(r => r.rating).sort((a, b) => b.rating - a.rating);
  const moods = {};
  for (const r of flex) if (r.mood) moods[MOODS[r.mood]] = (moods[MOODS[r.mood]] || 0) + r.amount;
  const decided = m.wishes.filter(w => w.decidedAt && ymd(new Date(w.decidedAt)) >= start && ymd(new Date(w.decidedAt)) < end);
  return {
    label: weekRange(start), start, spent: sum(flex.map(r => r.amount)), budget: m.plan.weekly, entries: tx.length,
    top: Object.entries(byCat).sort((a, b) => b[1] - a[1]).slice(0, 4).map(([k, v]) => [CATS[k].label, v]),
    best: rated[0] || null, worst: rated.length > 1 ? rated[rated.length - 1] : null,
    saved: sum(tx.filter(r => r.type === 'save').map(r => r.amount)),
    dropped: sum(decided.filter(w => w.status === 'dropped').map(w => +w.price || 0)), moods,
    delivery: flex.filter(isDelivery).length, bnpl: flex.filter(r => r.method === 'bnpl').length
  };
}

    bestRated: rd.best ? {what: rd.best.note || CATS[rd.best.category].label, lei: rd.best.amount, rating: rd.best.rating} : null,
    worstRated: rd.worst ? {what: rd.worst.note || CATS[rd.worst.category].label, lei: rd.worst.amount, rating: rd.worst.rating} : null,
    savedToGoals: Math.round(rd.saved), notSpentThanksToWaitList: Math.round(rd.dropped), spendingByMood: rd.moods, deliveryOrders: rd.delivery, buyNowPayLater: rd.bnpl};
}
