const VIEWS = {today: viewToday, money: viewMoney, goals: viewGoals, insights: viewInsights, coach: viewCoach};
/* ===================== writes ===================== */
const TX_OPT = ['time', 'note', 'category', 'tag', 'mood', 'method', 'fixed', 'rating', 'rateSkip', 'wishId', 'subId', 'source', 'goalId'];
function monthDoc(date){ return 'm-' + date.slice(0, 7); }
function txBody(r){
  const b = {type: r.type, amount: round2(r.amount), date: r.date, at: r.at || Date.now()};
  for (const k of TX_OPT){ const v = r[k]; b[k] = (v === '' || v === undefined || v === null || v === 0 || v === false) ? null : v; }
  if (r.type !== 'expense'){ b.category = null; b.tag = null; b.mood = null; b.method = null; b.fixed = null; b.rating = null; b.rateSkip = null; }
  return b;
}
function saveTx(rec, prevDoc){
  const doc = monthDoc(rec.date); const ops = [];
  if (prevDoc && prevDoc !== doc) ops.push(dbPatch(prevDoc, {tx: {[rec.id]: null}}));
  ops.push(dbPatch(doc, {kind: 'month', month: rec.date.slice(0, 7), tx: {[rec.id]: txBody(rec)}}));
  return Promise.all(ops);
}
function saveTxMany(recs){
  const by = {};
  for (const r of recs){ const d = monthDoc(r.date); (by[d] = by[d] || {kind: 'month', month: r.date.slice(0, 7), tx: {}}).tx[r.id] = txBody(r); }
  return Promise.all(Object.keys(by).map(d => dbPatch(d, by[d])));
}
function undoTx(recs){
  const by = {};
  for (const r of recs) (by[monthDoc(r.date)] = by[monthDoc(r.date)] || {tx: {}}).tx[r.id] = null;
  for (const d in by) dbPatch(d, by[d]).catch(() => {});
}
function patchItem(doc, id, body){ return dbPatch(doc, {kind: doc, items: {[id]: body}}); }

/* ===================== toasts ===================== */
function toast(msg, action){
  const root = $('#toasts'); if (!root) return;
  const el = document.createElement('div'); el.className = 'toast';
  const s = document.createElement('span'); s.textContent = msg; el.appendChild(s);
  if (action){ const b = document.createElement('button'); b.type = 'button'; b.textContent = action.label; b.addEventListener('click', () => { el.remove(); action.fn(); }); el.appendChild(b); }
  root.appendChild(el);
  setTimeout(() => el.remove(), action ? 6500 : 4000);
  while (root.children.length > 3) root.firstChild.remove();
}

/* ===================== sheets ===================== */
let SHEET = null;
function openSheet(view, state, opts){
  const opener = SHEET ? SHEET.opener : document.activeElement;
  if (SHEET && SHEET.opts.onClose){ const oc = SHEET.opts.onClose; SHEET.opts.onClose = null; oc(); }
  drafts.sheet = state || {};
  SHEET = {view, opener, opts: opts || {}, fresh: true};
  renderSheet();
  SHEET.fresh = false;
  document.body.style.overflow = 'hidden';
  setTimeout(() => {
    const root = $('#sheet-root');
    const f = root && (root.querySelector('[autofocus]') || root.querySelector('.sheet-body input:not([type=checkbox]):not([type=file]), .sheet-body textarea') || root.querySelector('.sheet [data-act="sheet-close"]'));
    if (f) try { f.focus({preventScroll: true}); } catch (e){}
  }, 40);
}
function renderSheet(){
  const root = $('#sheet-root'); if (!root) return;
  if (!SHEET){ root.innerHTML = ''; return; }
  const f = captureFocus(root);
  const old = root.querySelector('.sheet'); const sc = old ? old.scrollTop : 0;
  root.innerHTML = str(html`<div class="sheet-scrim ${SHEET.fresh ? 'enter' : ''}" data-act="sheet-scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">${SHEET.view(drafts.sheet)}</div></div>`);
  const ns = root.querySelector('.sheet'); if (ns) ns.scrollTop = sc;
  restoreFocus(f, root);
}
function closeSheet(){
  if (!SHEET) return;
  const op = SHEET.opener, oc = SHEET.opts.onClose;
  SHEET = null; drafts.sheet = null; renderSheet();
  document.body.style.overflow = '';
  if (oc) oc();
  if (op && document.contains(op)) try { op.focus({preventScroll: true}); } catch (e){}
}
function sheetHead(title){ return html`<div class="sheet-head"><h2 class="sheet-title" id="sheet-title">${title}</h2><button class="icon-btn" type="button" data-act="sheet-close" aria-label="Close">${icon('close')}</button></div>`; }
function confirmSheet(title, text, yes, danger){
  return new Promise(res => {
    openSheet(() => html`${sheetHead(title)}<div class="sheet-body"><p>${text}</p><div class="sheet-actions"><button class="btn quiet" type="button" data-act="confirm" data-v="0">Cancel</button><button class="btn ${danger ? 'danger' : 'primary'}" type="button" data-act="confirm" data-v="1">${yes}</button></div></div>`, {}, {onClose: () => res(false)});
    SHEET.resolve = res;
  });
}

    : Object.assign({type: 'expense', amount: '', dir: 'in', category: '', tag: '', mood: '', method: '', note: '', date: m.today, time: nowHM(), fixed: false, rating: 0, goalId: firstGoal, source: '', edit: false}, preset || {});

async function submitTx(){
  const st = drafts.sheet; if (!st) return;
  const amt = parseAmount(st.amount);
  if (!isFinite(amt) || amt <= 0){ st.err = 'Enter an amount above 0.'; renderSheet(); return; }
  if (!isYmd(st.date)){ st.err = 'Pick a date.'; renderSheet(); return; }
  if (st.type === 'expense' && !CATS[st.category]){ st.err = 'Pick a category.'; renderSheet(); return; }
  const rec = {id: st.id || uid('t'), type: st.type, amount: st.type === 'save' && st.dir === 'out' ? -round2(amt) : round2(amt), date: st.date, time: st.time || '', note: String(st.note || '').trim().slice(0, 80), at: st.at || Date.now()};
  if (st.type === 'expense') Object.assign(rec, {category: st.category, tag: TAGS[st.tag] ? st.tag : CATS[st.category].tag, mood: st.mood, method: st.method, fixed: !!st.fixed, rating: st.rating || 0, wishId: st.wishId || '', subId: st.subId || ''});
  if (st.type === 'income') rec.source = String(st.source || '').trim().slice(0, 40);
  if (st.type === 'save') rec.goalId = st.goalId || '';
  const edit = st.edit, prevDoc = st.doc, wishId = st.wishId;
  closeSheet();
  try { await saveTx(rec, edit ? prevDoc : null); } catch (e){ return; }
  if (wishId && !edit) patchItem('wish', wishId, {status: 'bought', decidedAt: Date.now(), txId: rec.id}).catch(() => {});
  if (edit) toast('Saved');
  else toast(L('Logged ', 'Notat: ') + lei(Math.abs(rec.amount)), {label: 'Undo', fn: () => { undoTx([rec]); if (wishId) patchItem('wish', wishId, {status: 'waiting', decidedAt: null, txId: null}).catch(() => {}); }});
}

async function submitMoney(){
  const st = drafts.sheet; if (!st) return;
  const amt = parseAmount(st.amount);
  if (!isFinite(amt) || amt <= 0){ st.err = 'Enter an amount above 0.'; renderSheet(); return; }
  const m = model(); const g = m.goals.find(x => x.id === st.goalId);
  const before = g ? g.saved : 0;
  const rec = {id: uid('t'), type: 'save', amount: st.dir === 'out' ? -round2(amt) : round2(amt), goalId: st.goalId, date: isYmd(st.date) ? st.date : m.today, time: nowHM(), at: Date.now()};

  if (g && rec.amount > 0 && before < g.target && before + rec.amount >= g.target) toast(L('You reached ' + g.name + '. That took real planning.', 'Ai atins obiectivul „' + g.name + '”. Asta a cerut planificare serioasă.'));

}

/* ===================== data export ===================== */
function saveFile(filename, data){
  if (!CAP.downloads && !window.claude){
    /* an ordinary website (for example on Netlify) can download directly */
    try {
      const blob = new Blob([data], {type: /\.csv$/.test(filename) ? 'text/csv;charset=utf-8' : 'application/json'});
      const url = URL.createObjectURL(blob); const a = document.createElement('a');
      a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
      toast(L('Downloaded ', 'Descărcat: ') + filename);
    } catch (e){ toast('Couldn’t download the file.'); }
    return;
  }
  if (!CAP.downloads){ toast('Downloads aren’t available in this view.'); return; }
  CAP.downloads.save({filename, data}).then(r => { if (r && r.status === 'saved') toast(L('Saved ', 'Salvat: ') + filename); }, e => {
    const c = e && e.code;
    if (c === 'declined') return;
    if (c === 'rate_limited') toast('A download is already waiting for you to confirm.');
    else if (c === 'extension_not_enabled' || c === 'rejected_extension') toast('That file type can’t be downloaded here.');
    else toast('Couldn’t download the file.');
  });
}
function csvCell(v){
  let s = v == null ? '' : String(v);
  if (/^[=+@\t\r]/.test(s) || (/^-/.test(s) && !/^-?\d+(\.\d+)?$/.test(s))) s = "'" + s;
  return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function exportCsv(){
  const m = model();
  const head = ['date', 'time', 'type', 'amount_lei', 'category', 'need_value_want', 'mood', 'paid_with', 'note', 'fixed_bill', 'worth_it_1_to_5', 'goal'];
  const rows = m.tx.slice().reverse().map(r => [r.date, r.time || '', r.type, String(round2(r.amount)), r.type === 'expense' ? CATS[r.category].label : '', r.type === 'expense' && TAGS[r.tag] ? TAGS[r.tag].label : '', MOODS[r.mood] || '', METHODS[r.method] || '', r.note || r.source || '', r.fixed ? 'yes' : '', r.rating || '', r.type === 'save' ? goalName(m, r.goalId) : '']);
  saveFile('lei-compass-' + m.today + '.csv', '﻿' + [head].concat(rows).map(r => r.map(csvCell).join(',')).join('\r\n'));
}

async function replaceAll(docs){
  const ok = id => /^(settings|goals|wish|subs|rev-\d{4}|m-\d{4}-\d{2})$/.test(id);
  const ids = Object.keys(docs).filter(id => ok(id) && isObj(docs[id]));
  const cur = Object.keys(DOCS() || {});
  const ops = [];
  for (const id of cur) if (!ids.includes(id)) ops.push(dbDel(id));
  for (const id of ids) ops.push(dbSet(id, docs[id]));
  await Promise.allSettled(ops);
  drafts.plan = null; drafts.review = {};
}
function onRestoreFile(input){
  const f = input.files && input.files[0]; if (!f) return;
  input.value = '';
  if (f.size > 8 * 1024 * 1024){ toast('That file is too big to be a Lei Compass backup.'); return; }
  const rd = new FileReader();
  rd.onload = async () => {
    let obj = null; try { obj = JSON.parse(String(rd.result)); } catch (e){}
    if (!obj || obj.app !== 'lei-compass' || !isObj(obj.docs)){ toast('That doesn’t look like a Lei Compass backup.'); return; }
    const when = typeof obj.exported === 'string' && isYmd(obj.exported.slice(0, 10)) ? dDate(obj.exported.slice(0, 10)) : L('that file', 'acel fișier');
    const ok = await confirmSheet('Restore this backup?', L('This replaces everything in Lei Compass with the backup from ' + when + '. You can’t undo it.', 'Asta înlocuiește tot ce e în Lei Compass cu backupul din ' + when + '. Nu poți anula.'), 'Replace my data', true);
    if (!ok) return;
    await replaceAll(obj.docs); toast('Backup restored.');
  };
  rd.readAsText(f);
}
async function resetAll(){
  const ok = await confirmSheet('Delete all your data?', 'This deletes your plan, entries, goals, wait list, subscriptions and reviews. Download a backup first if you might want them later.', 'Delete everything', true);

  drafts.plan = null; drafts.review = {}; drafts.ob = null; ui.obStep = 1; ui.tab = 'today';
  CHAT.turns = []; saveChat(); renderCoach();
  render(true); toast('All data deleted.');
}

async function submitQuick(){
  const text = String(drafts.quick || '').trim();
  if (!text || ui.quickBusy) return;
  const m = model();
  ui.quickErr = '';
  let items = null, source = 'rules', question = '';
  if (aiReady()){
    ui.quickBusy = true; render(true);
    try {
      const r = await AI.fn.json(parsePrompt(text, m), {modelTier: 'quick'});
      items = cleanAiItems(r, m.today, m); source = 'ai';
      question = r && typeof r.question === 'string' ? r.question.slice(0, 200) : '';
    } catch (e){ aiFatal(e); }
    finally { ui.quickBusy = false; }
  }
  if (!items || !items.length){ const ri = ruleParse(text, m.today, m); if (ri.length){ items = ri; source = 'rules'; } }
  if (!items || !items.length){ ui.quickErr = question || 'Couldn’t find an amount. Try “45 groceries”, or use the full form.'; render(true); return; }
  for (const it of items) if (it.type === 'expense' && it.tag === 'want' && m.plan.dials.includes(it.category)) it.tag = 'value';
  drafts.qp = items; drafts.qpQuestion = question; drafts.qpSource = source;
  render(true);
}
async function saveQuick(){
  const m = model(); const recs = [];
  for (const it of drafts.qp || []){
    const amt = parseAmount(it.amount);
    if (!isFinite(amt) || amt <= 0){ ui.quickErr = 'Check the amounts. Each one needs a number above 0.'; render(true); return; }
    const r = {id: uid('t'), type: it.type, amount: round2(amt), date: isYmd(it.date) ? it.date : m.today, time: it.time || '', note: String(it.note || '').trim().slice(0, 80), at: Date.now() + recs.length};
    if (it.type === 'expense'){ const c = CATS[it.category] ? it.category : 'other'; Object.assign(r, {category: c, tag: TAGS[it.tag] ? it.tag : CATS[c].tag, mood: MOODS[it.mood] ? it.mood : '', method: METHODS[it.method] ? it.method : '', fixed: !!CATS[c].fixed}); }
    if (it.type === 'income') r.source = String(it.source || it.note || '').trim().slice(0, 40);
    if (it.type === 'save') r.goalId = it.goalId || '';
    recs.push(r);
  }
  if (!recs.length) return;
  drafts.qp = null; drafts.quick = ''; drafts.qpQuestion = ''; ui.quickErr = '';
  render(true);
  try { await saveTxMany(recs); } catch (e){ return; }
  toast(recs.length === 1 ? L('Logged ', 'Notat: ') + lei(recs[0].amount) : L('Logged ' + recs.length + ' entries', 'Am notat ' + roN(recs.length, 'înregistrare', 'înregistrări')), {label: 'Undo', fn: () => undoTx(recs)});
}
async function reviewAi(){
  if (!aiReady()) return;
  const m = model(); const start = ui.reviewWeek || weekStartOf(m.today); const wk = weekKey(start);
  const st = ui.ai.review = {busy: true, err: ''}; render(true);
  try {
    const r = await AI.fn.json(reviewPrompt(m, reviewData(m, start)), {});
    const d = reviewDraft(model(), wk);
    const s = v => typeof v === 'string' ? v.trim().slice(0, 600) : '';
    if (!d.wentWell.trim() && s(r && r.wentWell)) d.wentWell = s(r.wentWell);
    if (!d.change.trim() && s(r && r.change)) d.change = s(r.change);
    if (!d.ifThen.trim() && s(r && r.ifThen)) d.ifThen = s(r.ifThen);
    if (s(r && r.summary)) d.summary = s(r.summary);
    d.dirty = true;
  } catch (e){ st.err = aiErr(e); aiFatal(e); }
  finally { st.busy = false; if (!st.err) delete ui.ai.review; render(true); }
}
async function saveReview(start){
  const m = model(); const wk = weekKey(start); const d = reviewDraft(m, wk); const rd = reviewData(m, start);
  const body = {start, wentWell: d.wentWell.trim().slice(0, 600), change: d.change.trim().slice(0, 600), ifThen: d.ifThen.trim().slice(0, 300), ai: d.summary ? d.summary.slice(0, 1200) : null, spent: round2(rd.spent), budget: round2(rd.budget), savedAt: Date.now()};
  if (!body.wentWell && !body.change && !body.ifThen){ toast('Write at least one answer first.'); return; }
  const year = wk.slice(0, 4);
  try {
    await dbPatch('rev-' + year, {kind: 'reviews', year: +year, items: {[wk]: body}});
    if (body.ifThen) await dbPatch('settings', {plans: {['p' + wk]: {text: body.ifThen, at: Date.now(), week: wk}}});
  } catch (e){ return; }
  d.dirty = false; render(true);
  toast(body.ifThen ? 'Review saved. Your if-then plan is on Today.' : 'Review saved.');
}

/* ===================== events ===================== */
let drT = 0;
function debounceRender(){ clearTimeout(drT); drT = setTimeout(() => render(true), 170); }
function onBind(e){
  const el = e.target; const path = el && el.dataset && el.dataset.bind; if (!path) return;
  const v = el.type === 'checkbox' ? el.checked : el.value;
  const root = path.split('.')[0];
  if (path.indexOf('.') < 0) drafts[root] = v; else setPath(drafts, path, v);
  if (root === 'plan' && drafts.plan){ drafts.plan.dirty = true; updatePlanLive(); }
  else if (root === 'wish') updateWishWait();
  else if (root === 'review'){ const wk = path.split('.')[1]; if (drafts.review[wk]) drafts.review[wk].dirty = true; }
  else if (root === 'sheet' && drafts.sheet){ (drafts.sheet.touched = drafts.sheet.touched || {})[path.split('.')[1]] = true; }
  else if (root === 'logq' || root === 'learnq'){ if (e.type === 'input') debounceRender(); }
}
document.addEventListener('click', e => {
  const el = e.target.closest && e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act;
  if (act === 'sheet-scrim'){ if (e.target === el) closeSheet(); return; }
  const fn = ACTIONS[act]; if (!fn) return;
  e.preventDefault();
  try { const r = fn(el, e); if (r && r.catch) r.catch(err => console.error(err)); } catch (err){ console.error(err); }
});
document.addEventListener('submit', e => {
  const f = e.target.closest && e.target.closest('form[data-form]'); if (!f) return;
  e.preventDefault();
  const fn = FORMS[f.dataset.form]; if (fn) fn(f);
});
document.addEventListener('input', e => { onBind(e); if (e.target && e.target.id === 'coach-text') autoGrow(e.target); });
document.addEventListener('change', e => {
  const el = e.target; if (!el || !el.dataset) return;
  if (el.dataset.bind) onBind(e);
  if (el.dataset.check){ dbPatch('settings', {check: {[el.dataset.check]: el.checked ? true : null}}).catch(() => {}); return; }
  if (el.dataset.pref === 'aiOff'){ prefs.aiOff = !el.checked; savePrefs(); renderCoach(); render(true); if (SHEET) renderSheet(); return; }
  if (el.id === 'restore-file'){ onRestoreFile(el); return; }
  if (el.hasAttribute('data-rerender')){ if (el.closest('#sheet-root')) renderSheet(); else render(true); }
});
document.addEventListener('toggle', e => { const d = e.target; if (d && d.dataset && d.dataset.learn) ui.learnOpen[d.dataset.learn] = d.open; }, true);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && SHEET){ e.preventDefault(); closeSheet(); return; }
  if (e.target && e.target.id === 'coach-text' && e.key === 'Enter' && !e.shiftKey && !e.isComposing){
    e.preventDefault(); FORMS.chat();
  }
});

/* tooltips for chart marks */
const tipEl = document.createElement('div'); tipEl.className = 'tip'; tipEl.setAttribute('role', 'tooltip'); tipEl.setAttribute('aria-hidden', 'true');
let tipFor = null;
function showTip(el, x, y){
  if (tipFor !== el){
    tipFor = el; tipEl.replaceChildren();
    const b = document.createElement('b'); b.textContent = el.dataset.tipv || '';
    const s = document.createElement('span'); s.textContent = el.dataset.tip || '';
    tipEl.append(b, s);
  }
  tipEl.classList.add('show');
  const w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  const left = clamp(x + 12, 8, Math.max(8, window.innerWidth - w - 8));
  let top = y - h - 12; if (top < 8) top = y + 18;
  tipEl.style.transform = 'translate(' + Math.round(left) + 'px,' + Math.round(top) + 'px)';
}
function hideTip(){ tipFor = null; tipEl.classList.remove('show'); }
document.addEventListener('pointermove', e => { const el = e.target.closest && e.target.closest('[data-tipv]'); if (!el){ if (tipFor) hideTip(); return; } showTip(el, e.clientX, e.clientY); }, {passive: true});
document.addEventListener('pointerdown', e => { if (e.pointerType === 'mouse') return; const el = e.target.closest && e.target.closest('[data-tipv]'); if (el) showTip(el, e.clientX, e.clientY); else if (tipFor) hideTip(); }, {passive: true});
document.addEventListener('focusin', e => { const el = e.target.closest && e.target.closest('[data-tipv]'); if (el){ const r = el.getBoundingClientRect(); showTip(el, r.left + Math.min(r.width / 2, 140), r.top); } else if (tipFor) hideTip(); });
window.addEventListener('scroll', () => { if (tipFor) hideTip(); }, {passive: true});

/* guilloche, the fine engraved lines on banknotes, drawn behind the daily number */
function drawGuilloche(){
  try {
    const color = getComputedStyle(document.documentElement).getPropertyValue('--jade').trim() || '#0b7a5e';
    const S = 560, c = document.createElement('canvas'); c.width = c.height = S;
    const g = c.getContext('2d'); if (!g) return;
    g.translate(S / 2, S / 2); g.strokeStyle = color; g.lineWidth = 1; g.globalAlpha = 0.17;
    const R0 = S * 0.33;
    for (let k = 0; k < 38; k++){
      const ph = k * Math.PI / 19;
      g.beginPath();
      for (let i = 0; i <= 720; i++){
        const t = i / 720 * Math.PI * 2;
        const r = R0 + 24 * Math.sin(9 * t + ph) + 12 * Math.cos(4 * t - ph * 0.5) - k * 1.15;
        const x = r * Math.cos(t), y = r * Math.sin(t);
        if (i) g.lineTo(x, y); else g.moveTo(x, y);
      }
      g.closePath(); g.stroke();
    }
    document.documentElement.style.setProperty('--guilloche', 'url("' + c.toDataURL('image/png') + '")');
  } catch (e){}
}

/* ===================== boot ===================== */
async function connect(){
  const c = window.claude;
  if (!c || typeof c.use !== 'function'){
    if (WEB){ aiSet(makeWebSample(window.LEI_CONFIG.aiEndpoint)); startLocal('web'); return; }
    aiSet(null); startLocal('no-runtime'); return;
  }
  c.use('sample').then(s => aiSet(s), () => aiSet(null));
  c.use('downloads').then(d => { CAP.downloads = d || null; if (SHEET) renderSheet(); }, () => {});
  c.use('permissions').then(p => { CAP.permissions = p || null; }, () => {});
  let db = null, user = null;
  try { const r = await Promise.all([c.use('db'), c.use('user')]); db = r[0]; user = r[1]; } catch (e){}
  if (!db){ startLocal('no-db'); return; }
  let id = null;
  if (user){ try { id = await user.id(); } catch (e){} }
  if (!id){ startLocal(user ? 'signed-out' : 'no-user'); return; }
  /* view-only visitors can't write even their own private space: give them a working browser-only app right away */
  if (typeof user.can === 'function'){ try { if (await user.can('data.write') === false){ startLocal('readonly'); return; } } catch (e){} }
  startCloud(db, id);
}
function setLang(k){
  if ((k !== 'en' && k !== 'ro') || k === LANG) return;
  const ob = drafts.ob, before = ob ? obDefaults() : null;
  LANG = k; try { localStorage.setItem(LS_LANG, k); } catch (e){}
  applyDataLang(); document.documentElement.lang = k;
  if (k === 'en') trRestore(document.body); else trTree(document.body);
  /* rename the untouched starter rows in onboarding */
  if (ob && before){
    const after = obDefaults();
    for (const key of ['incomes', 'fixed']) for (const r of ob[key]){ const i = before[key].indexOf(r.name); if (i > -1) r.name = after[key][i]; }
  }
  if (Store.demo){ Store.demoDocs = makeDemo(); drafts.review = {}; }
  MC.key = ''; bump();
  render(true); renderCoach(); if (SHEET) renderSheet();
}
function obDefaults(){ return {incomes: [L('From parents', 'De la părinți'), L('Scholarship (bursă)', 'Bursă'), L('Job', 'Job')], fixed: [L('Cămin or rent', 'Cămin sau chirie'), L('Phone', 'Telefon'), L('Transport pass', 'Abonament transport')]}; }
function boot(){
  applyDataLang(); document.documentElement.lang = LANG;
  startTranslator();
  document.body.appendChild(tipEl);
  buildCoach(); renderCoach();
  drawGuilloche();
  const mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  if (mq && mq.addEventListener) mq.addEventListener('change', drawGuilloche);
  try { new MutationObserver(drawGuilloche).observe(document.documentElement, {attributes: true, attributeFilter: ['data-theme']}); } catch (e){}
  if (wideMQ.addEventListener) wideMQ.addEventListener('change', () => render(true));
  const h = (location.hash || '').slice(1);
  const map = {log: 'money/log', plan: 'money/plan', subs: 'money/subs', goals: 'goals/goals', wait: 'goals/wait', patterns: 'insights/patterns', review: 'insights/review', coach: 'coach/ask', learn: 'coach/learn', today: 'today'};
  if (map[h]){ const p = map[h].split('/'); ui.tab = p[0]; if (p[1]) ui.sub[p[0]] = p[1]; }
  render(true);
  setTimeout(() => { ui.slowConnect = true; if (!Store.ready) render(true); }, 1300);
  setInterval(() => {
    if (!Store.ready || document.visibilityState === 'hidden' || SHEET) return;
    const a = document.activeElement;
    if (a && (a.tagName === 'SELECT' || a.tagName === 'TEXTAREA' || (a.tagName === 'INPUT' && a.type !== 'checkbox'))) return;
    if (ui.tab === 'today' || (ui.tab === 'goals' && ui.sub.goals === 'wait')) render(false);
  }, 60000);
  connect();
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
